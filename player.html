<script>
(function(){
  const X7P_KEY='TalhaX7P-2026-Stream';
  const X7P_ROUNDS=7;
  function x7pDecode(value){
    try{
      const binary=atob(String(value||''));
      const data=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)data[i]=binary.charCodeAt(i);
      const key=new TextEncoder().encode(X7P_KEY);
      for(let r=X7P_ROUNDS-1;r>=0;r--){
        let prev=key[r%key.length];
        for(let i=0;i<data.length;i++){
          const current=data[i];
          let x=(current-prev-((i*29+r*41)&255))&255;
          x=x^key[(i+r*3)%key.length];
          data[i]=x;
          prev=current;
        }
      }
      return new TextDecoder().decode(data);
    }catch(e){return '';}
  }
  const urls=Object.freeze({
    allowedOrigin:x7pDecode('FjZx2DqcuIfdJHq5gbMNWJFAdLmcCs1iyWHfl/0='),
    favicon:x7pDecode('FjZx2DqcuIcAexoHqa0XLjUMXrfOfcS8CBamgwK6RdZefwu9rV0='),
    clappr:x7pDecode('FjZx2DqcuIewvGPBSoqXQIKtD+fFpu+hEDgfKC3IAh9tlOu63bNrrvxIB1re9paBDBaQItM17Yr/UeYLAvHgQdakZCsb'),
    levelSelector:x7pDecode('FjZx2DqcuIewvGPBSoqXQIKtD+fFpu+hEDgfKC3IAh9tlOu63ZeU1lG5hybOblsi8M+QG2jeAB9pCFhIOOCkQPcfe28joNgdEsklXPVp216tsGR4/w=='),
    pip:x7pDecode('FjZx2DqcuIewvGPBSoqXQIKtD+fFpu+hEDgfKC0lNB/PQwfJwRbA7q9xH2WmIxB6bveOaouhnQvJ0J5WgcydJUg9W8e+Mh6en4p5gN0Exg=='),
    jquery:x7pDecode('FjZx2DqcuIewvGPBSoqXQIKtD+fFpu+hEDgfKC0C3sBIGD7tqTeeyTq0ktYsXK/6ZUfmhEGURLwVzxFv'),
    checklist1:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWEOP6UE0bHjyJgD1TPwq+lZb9br'),
    checklist2:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWERNs0IecMNtiNsr9vQUc8rFv1n'),
    checklist3:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWEROmmY0csV/qMgs5vokTeTfgnr'),
    checklist4:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWERIFNs3dM5lgvmjXsQ3UP3ci8d'),
    cinema:x7pDecode('FjZx2DqcuIcAPAdeJKkIsORrGmU8bsw1G1/s/xTSJZT9'),
    feedScript:x7pDecode('FjZx2DqcuIc2ddLGlhhRaFTONWXBYgPazAPsJ30KggSGQCjL8w=='),
    pphPrefix:x7pDecode('FjZx2DqcuIdZAcUPvHUb2fZ4v0VFGIRGTNUw6QTDJo4APfbXwcUQsw=='),
    warm1:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWEOP6UE0bHjyA=='),
    warm2:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWERNs0IecMNtg=='),
    warm3:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWEROmmY0csV/g=='),
    warm4:x7pDecode('FjZx2DqcuIcaLLcDoZz5hG8ZnWgiyNKLbWERIFNs3dM5lg=='),
    warm5:x7pDecode('FjZx2DqcuIcAPAdeJKkIsORrGmU8bsw1G18='),
    warm6:x7pDecode('FjZx2DqcuIc2ddLGlhhRaFTONWXBYgPazAM=')
  });
  let parsedOrigin=null;
  try{parsedOrigin=new URL(urls.allowedOrigin);}catch(e){}
  const allowedHost=parsedOrigin?.hostname||'';
  const protocol=parsedOrigin?.protocol||'';
  const isExact=()=>{
    try{
      const u=new URL(location.href);
      return !!parsedOrigin&&u.protocol===protocol&&u.hostname===allowedHost&&u.port===''&&u.origin===parsedOrigin.origin;
    }catch(e){return false;}
  };
  const isTop=()=>{try{return top===self;}catch(e){return false;}};
  const isEmbed=()=>{
    if(!isExact()||isTop())return false;
    try{return parent.location.origin===parsedOrigin.origin;}catch(e){return false;}
  };
  window.__X7P__={key:X7P_KEY,decode:x7pDecode,urls:Object.freeze({...urls,allowedHost,protocol,protocolRelative:'//'})};
  window.__TALHA_DOMAIN_ALLOWED__=isEmbed();
  if(!window.__TALHA_DOMAIN_ALLOWED__){window.__X7P_LIBS_READY__=Promise.resolve(false);return;}
  const favicon=document.getElementById('talha-favicon');
  if(favicon)favicon.href=urls.favicon;
  function loadScript(src,timeout=9000){
    return new Promise((resolve,reject)=>{
      if(!src){resolve();return;}
      const existing=[...document.scripts].find(s=>s.src===src);
      if(existing){
        if(existing.dataset.talhaLoaded==='1'){resolve();return;}
        let settled=false;
        const finish=err=>{if(settled)return;settled=true;clearTimeout(timer);err?reject(err):resolve();};
        existing.addEventListener('load',()=>{existing.dataset.talhaLoaded='1';finish();},{once:true});
        existing.addEventListener('error',()=>finish(new Error('External library failed')),{once:true});
        const timer=setTimeout(()=>finish(new Error('External library timed out')),timeout);
        return;
      }
      const script=document.createElement('script');
      let settled=false;
      const finish=err=>{if(settled)return;settled=true;clearTimeout(timer);err?reject(err):resolve();};
      script.src=src;
      script.async=false;
      script.onload=()=>{script.dataset.talhaLoaded='1';finish();};
      script.onerror=()=>finish(new Error('External library failed'));
      const timer=setTimeout(()=>finish(new Error('External library timed out')),timeout);
      document.head.appendChild(script);
    });
  }
  window.__X7P_FEED_PRELOAD__=loadScript(urls.feedScript,3200).catch(()=>null);
  window.__X7P_LIBS_READY__=loadScript(urls.clappr,6500).then(()=>Promise.all([
    urls.levelSelector?loadScript(urls.levelSelector,5000):Promise.resolve(),
    urls.pip?loadScript(urls.pip,5000):Promise.resolve(),
    urls.jquery?loadScript(urls.jquery,5000):Promise.resolve()
  ])).then(()=>true);
})();
</script>
<script>
(function(){
  const ORIGIN=window.__X7P__?.urls?.allowedOrigin||'';
  const HOST=window.__X7P__?.urls?.allowedHost||'';
  const PROTOCOL=window.__X7P__?.urls?.protocol||'';
  const exact=()=>{try{const u=new URL(location.href);return !!ORIGIN&&u.protocol===PROTOCOL&&u.hostname===HOST&&u.port===''&&u.origin===ORIGIN;}catch(e){return false;}};
  const topLevel=()=>{try{return top===self;}catch(e){return false;}};
  const authorized=()=>{if(topLevel()||!exact())return false;try{return parent.location.origin===ORIGIN;}catch(e){return false;}};
  const deny=()=>{
    window.__TALHA_DOMAIN_ALLOWED__=false;
    const style=document.createElement('style');
    style.textContent='html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;background:#000!important;color:#fff!important;overflow:hidden!important}';
    document.documentElement.appendChild(style);
    const render=()=>{if(!document.body)return;document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center"><div style="max-width:480px"><div style="font-size:18px;font-weight:800;margin-bottom:10px">Access Denied</div><div style="font-size:13px;line-height:1.6;color:rgba(255,255,255,.7)">This player can only run inside the authorized Talha player page.</div></div></div>';document.title='Access Denied';};
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true});else render();
  };
  window.__TALHA_DOMAIN_ALLOWED__=authorized();
  if(!window.__TALHA_DOMAIN_ALLOWED__)deny();
  window.__TALHA_DOMAIN_WATCHDOG__=setInterval(()=>{if(!authorized()){clearInterval(window.__TALHA_DOMAIN_WATCHDOG__);deny();try{stop();}catch(e){}try{document.querySelectorAll('video,iframe,audio').forEach(node=>{try{node.pause?.();}catch(e){}try{if(node.tagName==='IFRAME')node.src='about:blank';else{node.removeAttribute('src');node.load?.();}}catch(e){}});}catch(e){}}},1200);
})();
</script>
