class StreamPlayer{

  constructor(){

    this.player=null;
    this.pphFallbackUsed=false;
    this.sourceErrorHandled=false;
    this.currentBaseIndex=0;
    this.switchingBase=false;
    this.cinemaTried=false;
    this.checklistTried=false;
    this.feedTried=false;

    this.init();
  }

  async init(){

    window.activeStreamPlayer=this;

    showLoadingIndicator();

    const hash=this.parseHashParams(
      window.location.hash
    );

    this.urlConfig={
      watermark:this.safeDecode(
        hash.watermark||''
      ),
      watermarkLink:this.safeDecode(
        hash.watermarkLink||''
      ),
      watermarkPosition:this.safeDecode(
        hash.watermarkPosition||
        'bottom-left'
      )
    };

    this.input=normalizeInputId(
      getInputValue()
    );

    this.channelId=extractIdFromUrl(
      this.input
    );

    this.sourceMode='';
    this.currentBaseIndex=0;
    this.switchingBase=false;
    this.cinemaTried=false;
    this.checklistTried=false;
    this.feedTried=false;
    this.pphFallbackUsed=false;
    this.sourceErrorHandled=false;

    this.baseurls=[
      decodeProtectedLink('TVpHdHooSEccKC8uzoTa9uf7jZGKrbC0WAcJPT95AxkmJXzHwdfk4/GPmIju'),
      decodeProtectedLink('TVpHdHooSEccKC8uzoTa9uf7jZGKrbC0WAcKOT95AxkmJXzHwdfk4/GPmIju'),
      decodeProtectedLink('TVpHdHooSEccKC8uzoTa9uf7jZGKrbC0WAcKPT95AxkmJXzHwdfk4/GPmIju'),
      decodeProtectedLink('TVpHdHooSEccKC8uzoTa9uf7jZGKrbC0WAcKPz95AxkmJXzHwdfk4/GPmIju')
    ];

    this.directSource=
      /^https?:\/\//i.test(this.input) &&
      /\.m3u8(?:$|[?#])/i.test(this.input) &&
      isAllowedDirectSource(this.input)
        ? this.input
        : null;

    this.feedSource=null;
    this.streamPath=null;

    const forced=routeParam();

    if(this.directSource){

      this.source=this.directSource;
      this.sourceMode='direct';
      warmUrl(this.source);

    }else if(
      forced==='cinema' &&
      isAndroChannel(this.channelId)
    ){

      this.cinemaTried=true;

      this.source=
        await resolveCinemaSource(
          this.channelId,
          3000
        );

      this.sourceMode=
        this.source
          ? 'cinema'
          : '';

      warmUrl(this.source);

    }else if(
      forced==='checklist' &&
      this.channelId
    ){

      this.checklistTried=true;

      const resolved=
        await resolveChecklistSource(
          this.channelId,
          1800
        );

      this.currentBaseIndex=
        Number.isFinite(
          resolved?.index
        )
          ? resolved.index
          : 0;

      this.source=
        resolved?.url ||
        this.buildSourceForBase(
          this.channelId,
          this.currentBaseIndex
        );

      this.sourceMode=
        this.source
          ? 'checklist'
          : '';

      warmUrl(this.source);

    }else{

      const fast=
        await resolveFastDirectSource(
          this.input,
          this.channelId
        );

      if(fast){

        this.source=fast.url;
        this.sourceMode=fast.mode;

        this.currentBaseIndex=
          Number.isFinite(fast.index)
            ? fast.index
            : 0;

        this.feedTried=
          fast.mode==='feed';

        this.cinemaTried=
          fast.mode==='cinema';

        this.checklistTried=
          fast.mode==='checklist';

        warmUrl(this.source);

      }else{

        this.feedSource=
          await resolveFeedSource(
            this.input
          ).catch(
            ()=>null
          );

        const id=extractIdFromUrl(
          this.feedSource||
          this.input
        );

        this.channelId=
          id||
          this.channelId;

        if(
          this.feedSource &&
          /\.m3u8(?:$|[?#])/i.test(
            this.feedSource
          )
        ){

          this.source=this.feedSource;
          this.sourceMode='feed';
          this.feedTried=true;

        }else if(this.channelId){

          this.streamPath=
            this.getStreamPath(
              this.channelId
            );

          this.source=this.buildSource();

          this.sourceMode=
            this.streamPath
              ? 'checklist'
              : '';
        }

        warmUrl(this.source);
      }
    }

    if(!this.source){

      this.showFinalWarning(
        'Unable to fetch stream address.\nPlease check the channel ID or source link.'
      );

      return;
    }

    const params=new URLSearchParams(
      window.location.search
    );

    const title=params.get('title');

    if(title){

      try{
        document.title=title;
      }catch(e){}
    }

    if(
      this.sourceMode==='checklist' &&
      !this.streamPath
    ){

      this.streamPath=
        this.getStreamPath(
          this.channelId
        );
    }

    this.initPlayer();

    const container=document.getElementById(
      'player-container'
    );

    if(
      !container ||
      !this.player
    ){
      return;
    }

    this.player.attachTo(container);

    this.setupUnmuteOverlay();
    this.bindQualitySelectorUI();
    this.setupTopPlayerControls();

    observePlayerVideo();
    startAutoplayRetries();
  }

  safeDecode(value){

    try{
      return decodeURIComponent(value);
    }catch(e){
      return String(value||'');
    }
  }

  isPphEligible(){

    return isPphFallbackChannel(
      this.channelId
    );
  }

  getPphFallbackUrl(){

    return getEightDigitPphSource(
      this.channelId
    );
  }

  showPphFallbackIframe(
    explicitUrl=null
  ){

    if(this.pphFallbackUsed){
      return false;
    }

    if(!this.isPphEligible()){
      return false;
    }

    const source=
      explicitUrl||
      this.getPphFallbackUrl();

    if(!source){
      return false;
    }

    this.pphFallbackUsed=true;
    this.sourceErrorHandled=true;

    clearAutoplayTimers();

    try{
      if(
        this.player &&
        typeof this.player.stop==='function'
      ){
        this.player.stop();
      }
    }catch(e){}

    const layer=document.getElementById(
      'pph-fallback-layer'
    );

    const frame=document.getElementById(
      'pph-fallback-frame'
    );

    const playerContainer=document.getElementById(
      'player-container'
    );

    const unmute=document.getElementById(
      'unmute-overlay-btn'
    );

    const pip=document.getElementById(
      'pip-top-btn'
    );

    if(playerContainer){

      playerContainer.style.visibility='hidden';
      playerContainer.style.pointerEvents='none';
    }

    if(unmute){
      unmute.classList.add('hidden');
    }

    if(pip){

      pip.classList.add('unsupported');
      pip.classList.remove('active');

      pip.setAttribute(
        'aria-pressed',
        'false'
      );

      pip.title=
        'Picture in Picture unavailable';
    }

    hidePoster();
    hideLoadingIndicator();

    if(!layer || !frame){
      return false;
    }

    frame.src='about:blank';

    layer.classList.add('active');

    layer.setAttribute(
      'aria-hidden',
      'false'
    );

    requestAnimationFrame(
      ()=>{

        try{

          const target=new URL(
            String(source||''),
            window.location.href
          );

          if(
            target.protocol!=='https:' &&
            target.protocol!=='http:'
          ){
            return;
          }

          frame.src=target.href;

        }catch(e){}
      }
    );

    return true;
  }

  showFinalWarning(messageText){

    hideLoadingIndicator();

    const warning=document.getElementById(
      'uyarikutu'
    );

    const message=document.getElementById(
      'uyari-mesaj'
    );

    if(message){
      message.innerText=messageText;
    }

    if(warning){
      warning.style.display='flex';
    }
  }

  buildSourceForBase(
    id,
    index
  ){

    const bases=this.baseurls||[];

    if(
      !bases[index] ||
      !id
    ){
      return null;
    }

    const path=this.getStreamPath(
      id
    );

    return path
      ? bases[index]+path
      : null;
  }

  async resolveAndUseChecklist(){

    if(
      !this.channelId ||
      !isAndroChannel(this.channelId)
    ){
      return false;
    }

    this.checklistTried=true;

    const result=
      await resolveChecklistSource(
        this.channelId,
        1800
      );

    if(
      result &&
      result.url
    ){

      this.currentBaseIndex=result.index;
      this.source=result.url;
      this.sourceMode='checklist';

      this.streamPath=
        this.getStreamPath(
          this.channelId
        );

      warmUrl(this.source);

      return true;
    }

    this.currentBaseIndex=0;

    this.source=
      this.buildSourceForBase(
        this.channelId,
        0
      );

    this.sourceMode=
      this.source
        ? 'checklist'
        : '';

    this.streamPath=
      this.getStreamPath(
        this.channelId
      );

    warmUrl(this.source);

    return !!this.source;
  }

  async loadSource(newSource){

    if(
      !this.player ||
      !newSource ||
      this.pphFallbackUsed
    ){
      return false;
    }

    this.source=newSource;
    this.sourceErrorHandled=false;

    clearAutoplayTimers();

    showLoadingIndicator();

    warmUrl(newSource);

    try{

      this.player.load(
        newSource
      );

      try{
        this.player.play();
      }catch(e){}

    }catch(e){

      try{

        this.player.configure({
          source:newSource
        });

        try{
          this.player.play();
        }catch(error){}

      }catch(error){}
    }

    setTimeout(
      ()=>{

        if(this.pphFallbackUsed){
          return;
        }

        observePlayerVideo();
        applyVideoFilters();

        const video=document.querySelector(
          '#player-container video'
        );

        if(!video){
          return;
        }

        if(audioUnlocked){

          applyDesiredAudioState(
            video
          );

        }else{

          forceAutoplay();
        }

      },
      100
    );

    return true;
  }

  redirectToPph(){

    if(this.isPphEligible()){
      return this.showPphFallbackIframe();
    }

    this.showFinalWarning(
      'Unable to fetch stream address.\nPlease check the channel ID or source link.'
    );

    return false;
  }

  initPlayer(){

    if(
      typeof Clappr==='undefined'
    ){

      this.showFinalWarning(
        'Player library failed to load.\nPlease refresh the page.'
      );

      return;
    }

    const plugins=[];

    if(window.LevelSelector){

      plugins.push(
        window.LevelSelector
      );
    }

    if(window.ClapprPip){

      if(window.ClapprPip.PipPlugin){

        plugins.push(
          window.ClapprPip.PipPlugin
        );
      }

      if(window.ClapprPip.PipButton){

        plugins.push(
          window.ClapprPip.PipButton
        );
      }
    }

    if(window.ClapprPIPPlugin){

      plugins.push(
        window.ClapprPIPPlugin
      );
    }

    this.player=new Clappr.Player({

      source:this.source,

      autoPlay:true,
      mute:true,

      disableVideoTagContextMenu:true,

      height:'100%',
      width:'100%',

      position:'bottom-left',

      chromeless:isIOS,

      watermark:
        this.urlConfig.watermark||
        undefined,

      watermarkLink:
        this.urlConfig.watermarkLink||
        undefined,

      levelSelectorConfig:{

        title:'QUALITY',

        labels:{
          '-1':'Auto'
        },

        labelCallback:
          function(
            playbackLevel,
            customLabel
          ){

            if(
              playbackLevel &&
              playbackLevel.level &&
              playbackLevel.level.height
            ){

              return(
                playbackLevel.level.height+
                'p'
              );
            }

            if(customLabel){
              return customLabel;
            }

            if(
              playbackLevel &&
              playbackLevel.level &&
              playbackLevel.level.bitrate
            ){

              return(
                Math.round(
                  playbackLevel.level.bitrate/1000
                )+
                ' kbps'
              );
            }

            return 'Auto';
          }
      },

      hlsjsConfig:{

        enableWorker:true,

        lowLatencyMode:true,

        startLevel:-1,

        liveSyncDurationCount:2,

        liveMaxLatencyDurationCount:4,

        liveDurationInfinity:true,

        maxBufferLength:9,

        maxMaxBufferLength:14,

        maxBufferSize:18*1000*1000,

        maxBufferHole:.5,

        backBufferLength:20,

        capLevelToPlayerSize:true,

        levelLoadingMaxRetry:2,

        fragLoadingMaxRetry:3,

        manifestLoadingMaxRetry:2,

        levelLoadingTimeOut:7000,

        fragLoadingTimeOut:10000,

        manifestLoadingTimeOut:7000,

        enableSoftwareAES:true,

        xhrSetup:(xhr)=>{

          try{
            xhr.withCredentials=false;
          }catch(e){}

          xhr.addEventListener(
            'loadend',
            ()=>{

              if(
                this.streamPath &&
                xhr.status===403
              ){

                if(
                  this.isPphEligible() &&
                  !this.pphFallbackUsed
                ){

                  this.showPphFallbackIframe();

                }else{

                  this.switchToNextBase(
                    '403'
                  );
                }
              }

            },
            {passive:true}
          );
        }
      },

      playback:{

        playInline:true,

        controls:isIOS,

        crossOrigin:'anonymous'
      },

      disableErrorScreen:true,

      plugins,

      language:'en',

      strings:{

        en:{

          live:'LIVE',

          default_error_message:
            'A playback error occurred.',

          default_error_title:
            'Notice'
        }
      }
    });

    this.setupPlayerEvents();
  }

  setupUnmuteOverlay(){

    const button=document.getElementById(
      'unmute-overlay-btn'
    );

    if(!button){
      return;
    }

    button.addEventListener(
      'click',
      event=>{

        event.preventDefault();
        event.stopPropagation();

        unmuteEverything();
      }
    );

    if(this.player){

      this.player.on(
        Clappr.Events.PLAYER_VOLUMEUPDATE,
        volume=>{

          syncAudioFromPlayer(
            volume
          );

          if(Number(volume)>0){

            button.classList.add(
              'hidden'
            );

          }else{

            if(audioUnlocked){

              button.classList.remove(
                'hidden'
              );
            }
          }

          updateUnmuteButtonState();
        }
      );
    }

    updateUnmuteButtonState();
  }

  bindQualitySelectorUI(){

    const dropdown=document.getElementById(
      'drawer-quality-selector'
    );

    if(
      !dropdown ||
      !this.player
    ){
      return;
    }

    const populate=(attempt=0)=>{

      if(this.pphFallbackUsed){
        return;
      }

      const plugin=this.player.getPlugin(
        'level_selector'
      );

      const levels=
        Array.isArray(plugin?.levels)
          ? plugin.levels
          : [];

      if(levels.length){

        const current=dropdown.value;

        dropdown.innerHTML=
          '<option value="-1">Auto</option>';

        levels.forEach(
          (level,index)=>{

            const height=Number(
              level?.height||0
            );

            const bitrate=Number(
              level?.bitrate||0
            );

            const label=
              height
                ? `${height}p`
                : bitrate
                  ? `${Math.round(bitrate/1000)} kbps`
                  : `Level ${index+1}`;

            const option=document.createElement(
              'option'
            );

            option.value=String(index);
            option.textContent=label;

            dropdown.appendChild(
              option
            );
          }
        );

        if(
          [...dropdown.options].some(
            option=>option.value===current
          )
        ){

          dropdown.value=current;
        }

        return;
      }

      if(attempt<18){

        setTimeout(
          ()=>{
            populate(
              attempt+1
            );
          },
          450
        );
      }
    };

    this.player.on(
      Clappr.Events.PLAYER_READY,
      ()=>{

        resetControlsTimer();

        setTimeout(
          ()=>{

            populate();
            observePlayerVideo();
            applyVideoFilters();

            if(audioUnlocked){

              const video=document.querySelector(
                '#player-container video'
              );

              if(video){
                applyDesiredAudioState(
                  video
                );
              }

            }else{

              startAutoplayRetries();
            }

          },
          80
        );
      }
    );

    dropdown.addEventListener(
      'change',
      event=>{

        if(this.pphFallbackUsed){
          return;
        }

        const value=Number(
          event.target.value
        );

        const plugin=this.player.getPlugin(
          'level_selector'
        );

        if(
          plugin &&
          typeof plugin.changeLevel==='function'
        ){

          plugin.changeLevel(
            Number.isFinite(value)
              ? value
              : -1
          );
        }
      }
    );
  }

  setupTopPlayerControls(){

    const pip=document.getElementById(
      'pip-top-btn'
    );

    if(pip){

      pip.addEventListener(
        'click',
        event=>{

          event.preventDefault();
          event.stopPropagation();

          this.togglePictureInPicture();
        }
      );

      this.updatePipButton();

      const video=this.getCurrentVideo();

      video?.addEventListener(
        'click',
        ()=>{
          setTimeout(
            ()=>{
              this.updatePipButton();
            },
            50
          );
        },
        {passive:true}
      );

      document.addEventListener(
        'enterpictureinpicture',
        ()=>{
          this.updatePipButton();
        },
        {passive:true}
      );

      document.addEventListener(
        'leavepictureinpicture',
        ()=>{
          this.updatePipButton();
        },
        {passive:true}
      );
    }

    this.player?.on?.(
      Clappr.Events.PLAYER_READY,
      ()=>{
        this.updatePipButton();
        resetControlsTimer();
      }
    );
  }

  getCurrentVideo(){

    return document.querySelector(
      '#player-container video'
    );
  }

  async togglePictureInPicture(){

    if(this.pphFallbackUsed){
      return;
    }

    const video=this.getCurrentVideo();

    if(!video){
      return;
    }

    try{

      if(document.pictureInPictureElement){

        await document.exitPictureInPicture();

        this.updatePipButton();

        return;
      }

      if(video.webkitSetPresentationMode){

        video.webkitSetPresentationMode(
          video.webkitPresentationMode===
          'picture-in-picture'
            ? 'inline'
            : 'picture-in-picture'
        );

        this.updatePipButton();

        return;
      }

      if(video.requestPictureInPicture){

        await video.requestPictureInPicture();

        this.updatePipButton();

        return;
      }

    }catch(e){}

    this.updatePipButton();
  }

  updatePipButton(){

    const button=document.getElementById(
      'pip-top-btn'
    );

    const video=this.getCurrentVideo();

    if(!button){
      return;
    }

    if(this.pphFallbackUsed){

      button.classList.add(
        'unsupported'
      );

      button.classList.remove(
        'active'
      );

      button.setAttribute(
        'aria-pressed',
        'false'
      );

      button.title=
        'Picture in Picture unavailable';

      return;
    }

    const supported=!!(
      video?.requestPictureInPicture||
      video?.webkitSetPresentationMode
    );

    button.classList.toggle(
      'unsupported',
      !supported
    );

    button.title=
      supported
        ? 'Picture in Picture'
        : 'Picture in Picture unavailable';

    const active=!!(
      document.pictureInPictureElement||
      video?.webkitPresentationMode==='picture-in-picture'
    );

    button.classList.toggle(
      'active',
      active
    );

    button.setAttribute(
      'aria-pressed',
      active?'true':'false'
    );
  }

  parseHashParams(hash){

    if(
      !hash ||
      hash==='#'
    ){
      return {};
    }

    const result={};

    hash
      .substring(1)
      .split('&')
      .forEach(
        item=>{

          const index=item.indexOf('=');

          if(index===-1){
            return;
          }

          const key=item.substring(
            0,
            index
          );

          const value=item.substring(
            index+1
          );

          if(key){
            result[key]=value;
          }
        }
      );

    return result;
  }

  buildSource(){

    if(!this.streamPath){
      return null;
    }

    return(
      this.baseurls[
        this.currentBaseIndex
      ]+
      this.streamPath
    );
  }

  getStreamPath(id){

    const value=String(
      id||''
    );

    const useRealStream=
      pageURL.searchParams.get('real')==='1';

    if(!value){
      return null;
    }

    if(
      (
        value==='androstreamlivebs1'||
        value==='facebooklivebs1'
      ) &&
      !useRealStream
    ){

      return 'batutest.m3u8';
    }

    if(
      value.startsWith('facebooklive')
    ){

      return(
        value+
        '.m3u8'
      );
    }

    if(
      value.startsWith('androstreamlive')
    ){

      if(isIOS){

        const suffix=value.substring(
          'androstreamlive'.length
        );

        return(
          'facebooklive'+
          suffix+
          '.m3u8'
        );
      }

      return(
        value+
        '.m3u8'
      );
    }

    return null;
  }

  setupPlayerEvents(){

    if(!this.player){
      return;
    }

    this.player.on(
      Clappr.Events.PLAYER_READY,
      ()=>{

        resetControlsTimer();

        try{

          $('.clappr-watermark a')
            .removeAttr('target')
            .removeAttr('href')
            .css(
              'cursor',
              'initial'
            );

        }catch(e){}

        setTimeout(
          ()=>{

            observePlayerVideo();
            applyVideoFilters();

            if(
              audioSettings.gain!==100||
              audioSettings.bass||
              audioSettings.vocal
            ){

              setupAudioNodes();
            }

            if(audioUnlocked){

              const video=document.querySelector(
                '#player-container video'
              );

              if(video){

                applyDesiredAudioState(
                  video
                );
              }

            }else{

              startAutoplayRetries();
            }

          },
          80
        );
      }
    );

    this.player.on(
      Clappr.Events.PLAYER_PLAY,
      ()=>{
        hidePoster();
        applyVideoFilters();
      }
    );

    this.player.on(
      Clappr.Events.PLAYER_PLAYING,
      ()=>{

        hidePoster();
        hideLoadingIndicator();

        const video=document.querySelector(
          '#player-container video'
        );

        if(
          video &&
          !audioUnlocked
        ){

          video.muted=true;
          video.volume=0;
        }
      }
    );

    this.player.on(
      Clappr.Events.PLAYER_VOLUMEUPDATE,
      volume=>{
        syncAudioFromPlayer(
          volume
        );
      }
    );

    this.player.on(
      Clappr.Events.PLAYER_BUFFER,
      ()=>{

        if(!this.pphFallbackUsed){
          applyVideoFilters();
        }
      }
    );

    if(
      this.player.core &&
      Clappr.Events.CORE_ACTIVE_CONTAINER_CHANGED
    ){

      this.player.core.on(
        Clappr.Events.CORE_ACTIVE_CONTAINER_CHANGED,
        container=>{

          if(
            container &&
            Clappr.Events.CONTAINER_ERROR
          ){

            container.on(
              Clappr.Events.CONTAINER_ERROR,
              ()=>{

                if(
                  this.isPphEligible() &&
                  !this.pphFallbackUsed
                ){

                  this.showPphFallbackIframe();

                }else{

                  this.handlePlaybackError();
                }
              }
            );
          }

          if(
            container &&
            Clappr.Events.CONTAINER_TIMEUPDATE
          ){

            container.on(
              Clappr.Events.CONTAINER_TIMEUPDATE,
              ()=>{

                hidePoster();

                const video=document.querySelector(
                  '#player-container video'
                );

                if(
                  video &&
                  video.currentTime>0
                ){
                  hideLoadingIndicator();
                }
              }
            );
          }
        }
      );
    }

    this.player.on(
      Clappr.Events.PLAYER_ERROR,
      ()=>{

        if(
          this.isPphEligible() &&
          !this.pphFallbackUsed
        ){

          this.showPphFallbackIframe();

        }else{

          this.handlePlaybackError();
        }
      }
    );
  }

  handlePlaybackError(){

    if(
      this.isPphEligible() &&
      !this.pphFallbackUsed
    ){

      this.showPphFallbackIframe();

      return;
    }

    this.switchToNextBase(
      'playback error'
    );
  }

  async switchToNextBase(reason){

    if(
      this.isPphEligible() &&
      !this.pphFallbackUsed
    ){

      this.showPphFallbackIframe();

      return true;
    }

    if(this.switchingBase){
      return false;
    }

    this.switchingBase=true;

    showLoadingIndicator();
    clearAutoplayTimers();

    try{

      if(
        this.sourceMode==='feed' &&
        !this.cinemaTried &&
        isAndroChannel(this.channelId)
      ){

        this.cinemaTried=true;

        const cinema=
          await resolveCinemaSource(
            this.channelId,
            2200
          );

        if(cinema){

          this.source=cinema;
          this.sourceMode='cinema';

          await this.loadSource(
            cinema
          );

          return true;
        }
      }

      if(
        this.sourceMode!=='checklist' &&
        isAndroChannel(this.channelId) &&
        !this.checklistTried
      ){

        const ok=
          await this.resolveAndUseChecklist();

        if(ok){

          await this.loadSource(
            this.source
          );

          return true;
        }
      }

      if(
        this.sourceMode==='checklist'
      ){

        if(
          this.currentBaseIndex<
          this.baseurls.length-1
        ){

          this.currentBaseIndex++;

          const next=
            this.buildSourceForBase(
              this.channelId,
              this.currentBaseIndex
            );

          if(next){

            this.source=next;

            await this.loadSource(
              next
            );

            return true;
          }
        }
      }

      this.showFinalWarning(
        'Playback failed.\nThe stream is currently unavailable.'
      );

      return false;

    }finally{

      setTimeout(
        ()=>{
          this.switchingBase=false;
        },
        700
      );
    }
  }
}

if(
  window.ClapprPIPPlugin &&
  !window.ClapprPip
){

  window.ClapprPip={
    PipPlugin:
      window.ClapprPIPPlugin
  };
}

try{

  if(!enforcePlayerSecurity()){

    throw new Error(
      'Unauthorized player environment'
    );
  }

  window.__TALHA_STREAM_PLAYER_INSTANCE__=
    new StreamPlayer();

  startSecurityWatchdog();

}catch(error){

  console.error(
    'Player startup error:',
    error
  );

  hideLoadingIndicator();

  if(
    !isAllowedPlayerDomain()
  ){

    showSecurityBlock();

  }else{

    const warning=document.getElementById(
      'uyarikutu'
    );

    const message=document.getElementById(
      'uyari-mesaj'
    );

    if(message){

      message.innerText=
        'Player startup failed.\nPlease refresh the page.';
    }

    if(warning){
      warning.style.display='flex';
    }
  }
}
</script>
