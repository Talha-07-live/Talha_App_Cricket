<!doctype html>
<html lang="en" data-theme="cyber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Talha's Player</title>
<link rel="icon" href="https://s10.gifyu.com/images/SrMU9.png">

<style>
:root[data-theme="netflix"]{
  --skin-accent:#E50914;
  --skin-accent-hover:#FF2E38;
  --skin-glow:rgba(229,9,20,.6);
  --skin-bg:#000;
  --skin-card:rgba(18,10,12,.94);
  --skin-text:#fff;
}
:root[data-theme="cyber"]{
  --skin-accent:#00F2FE;
  --skin-accent-hover:#4FACFE;
  --skin-glow:rgba(0,242,254,.6);
  --skin-bg:#030712;
  --skin-card:rgba(6,16,26,.94);
  --skin-text:#fff;
}
:root[data-theme="prime"]{
  --skin-accent:#00A8E1;
  --skin-accent-hover:#33BCEB;
  --skin-glow:rgba(0,168,225,.6);
  --skin-bg:#050D18;
  --skin-card:rgba(5,20,35,.94);
  --skin-text:#fff;
}
:root[data-theme="gold"]{
  --skin-accent:#FFD700;
  --skin-accent-hover:#FFE033;
  --skin-glow:rgba(255,215,0,.6);
  --skin-bg:#0A0905;
  --skin-card:rgba(22,19,10,.94);
  --skin-text:#fff;
}
:root[data-theme="emerald"]{
  --skin-accent:#00E676;
  --skin-accent-hover:#33EB91;
  --skin-glow:rgba(0,230,118,.6);
  --skin-bg:#010C06;
  --skin-card:rgba(4,22,12,.94);
  --skin-text:#fff;
}
:root[data-theme="amethyst"]{
  --skin-accent:#A855F7;
  --skin-accent-hover:#C084FC;
  --skin-glow:rgba(168,85,247,.6);
  --skin-bg:#08030D;
  --skin-card:rgba(18,8,28,.94);
  --skin-text:#fff;
}
:root{
  --player-control-accent:var(--skin-accent);
  --player-control-accent-hover:var(--skin-accent-hover);
  --player-control-glow:var(--skin-glow);
  --player-control-bg:var(--skin-card);
  --player-control-border:var(--skin-accent);
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:var(--skin-text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  overflow:hidden;
}
body{
  touch-action:manipulation;
}
#app{
  position:relative;
  width:100%;
  height:100%;
  background:#000;
}
#player-shell,
#player-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}
#player-container .clappr-player,
#player-container .player-poster{
  width:100%!important;
  height:100%!important;
}
#player-container video{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
#pph-fallback-layer{
  position:absolute;
  inset:0;
  z-index:40;
  width:100%;
  height:100%;
  display:none;
  background:#000;
  overflow:hidden;
}
#pph-fallback-layer.active{
  display:block;
}
#pph-fallback-layer iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  margin:0;
  padding:0;
  background:#000;
}
#custom-poster-overlay{
  position:absolute;
  inset:0;
  z-index:50;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#030712;
  cursor:pointer;
  user-select:none;
  transition:opacity .45s ease,visibility .45s ease;
}
#custom-poster-overlay.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#custom-poster-overlay svg{
  width:100%;
  height:100%;
  object-fit:cover;
}
#player-loading-indicator{
  position:absolute;
  left:50%;
  bottom:18px;
  z-index:3;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:154px;
  min-height:34px;
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 12px var(--skin-glow);
  opacity:1;
  visibility:visible;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility .55s ease;
}
#player-loading-indicator.hide{
  opacity:0;
  visibility:hidden;
  transform:translateX(-50%) translateY(16px) scale(.96);
  pointer-events:none;
}
#player-loading-dots{
  display:inline-block;
  width:18px;
  margin-left:3px;
  overflow:hidden;
  text-align:left;
  vertical-align:bottom;
}
#player-loading-dots::after{
  content:"";
  display:inline-block;
  animation:loadingDots 1.15s steps(4,end) infinite;
}
@keyframes loadingDots{
  0%{content:""}
  25%{content:"."}
  50%{content:".."}
  75%{content:"..."}
  100%{content:""}
}
#unmute-overlay-btn{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:5px 12px;
  border:1px solid var(--skin-accent);
  border-radius:20px;
  background:rgba(0,0,0,.86);
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.5px;
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 15px rgba(0,0,0,.6),0 0 10px var(--skin-glow);
  transition:all .22s cubic-bezier(.2,.8,.2,1);
  user-select:none;
  touch-action:manipulation;
}
#unmute-overlay-btn:hover{
  background:var(--skin-accent);
  color:#000;
  transform:translateX(-50%) scale(1.05);
}
#unmute-overlay-btn:active{
  transform:translateX(-50%) scale(.97);
}
#unmute-overlay-btn svg{
  width:12px;
  height:12px;
  fill:currentColor;
}
#unmute-overlay-btn.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateX(-50%) translateY(-10px);
}
#pip-top-btn{
  position:absolute;
  top:14px;
  left:14px;
  z-index:120;
  min-width:46px;
  height:34px;
  padding:0 11px;
  border:1px solid var(--skin-accent);
  border-radius:10px;
  background:rgba(0,0,0,.82);
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.5px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 18px rgba(0,0,0,.55),0 0 12px var(--skin-glow);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease,opacity .3s ease,visibility .3s ease;
  touch-action:manipulation;
  user-select:none;
}
#pip-top-btn:hover{
  background:var(--skin-accent);
  color:#000;
  transform:translateY(-1px) scale(1.03);
}
#pip-top-btn:active{
  transform:scale(.96);
}
#pip-top-btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}
#pip-top-btn.active{
  background:var(--skin-accent);
  color:#000;
}
#pip-top-btn.unsupported{
  opacity:.68;
}
#settings-toggle-btn{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  right:max(12px,env(safe-area-inset-right,0px));
  z-index:10000;
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  line-height:1;
  box-shadow:0 4px 18px rgba(0,0,0,.6);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s ease,box-shadow .22s ease,opacity .3s ease,visibility .3s ease;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
#pip-top-btn.fade-hidden,
#settings-toggle-btn.fade-hidden{
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
}
#settings-toggle-btn:hover,
#settings-toggle-btn:focus-visible{
  transform:rotate(45deg) scale(1.06);
  border-color:var(--skin-accent);
  box-shadow:0 0 18px var(--skin-glow),0 6px 18px rgba(0,0,0,.5);
  outline:none;
}
#settings-toggle-btn:active{
  transform:scale(.95);
}
#control-drawer{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 58px);
  right:max(12px,env(safe-area-inset-right,0px));
  z-index:10001;
  width:min(320px,calc(100vw - 24px));
  max-height:min(75dvh,480px);
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.25) transparent;
  background:var(--skin-card);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  padding:12px;
  display:none;
  flex-direction:column;
  gap:12px;
  box-shadow:0 16px 45px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.3);
  animation:drawerIn .2s cubic-bezier(.2,.8,.2,1);
  contain:layout paint style;
  touch-action:pan-y;
}
#control-drawer::-webkit-scrollbar{
  width:5px;
}
#control-drawer::-webkit-scrollbar-track{
  background:transparent;
}
#control-drawer::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.25);
  border-radius:10px;
}
#control-drawer.open{
  display:flex;
}
@keyframes drawerIn{
  from{
    opacity:0;
    transform:translate3d(0,-8px,0) scale(.98);
  }
  to{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
  }
}
.drawer-tabs{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  width:100%;
  flex:0 0 auto;
  gap:2px;
  padding:3px;
  background:rgba(0,0,0,.65);
  border-radius:10px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.tab-btn{
  flex:1 1 0;
  min-width:0;
  min-height:34px;
  padding:6px 4px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:rgba(255,255,255,.65);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.4px;
  cursor:pointer;
  touch-action:manipulation;
}
.tab-btn:focus-visible{
  outline:2px solid var(--skin-accent);
  outline-offset:1px;
}
.tab-btn.active{
  background:var(--skin-accent);
  color:#000;
  box-shadow:0 0 10px var(--skin-glow);
}
.tab-content{
  display:none;
  flex-direction:column;
  gap:10px;
  min-width:0;
  flex:0 0 auto;
}
.tab-content.active{
  display:flex;
}
.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:rgba(255,255,255,.55);
  font-weight:800;
}
.control-group{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:0;
}
.control-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:rgba(255,255,255,.85);
}
.control-header span:first-child{
  min-width:0;
}
.control-header span.val{
  color:var(--skin-accent);
  font-weight:700;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
input[type="range"]{
  display:block;
  width:100%;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  touch-action:pan-x;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
}
input[type="range"]::-moz-range-track{
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
}
input[type="range"]::-webkit-slider-thumb{
  width:15px;
  height:15px;
  margin-top:-5px;
  border:0;
  border-radius:50%;
  background:var(--skin-accent);
  box-shadow:0 0 8px var(--skin-glow);
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}
input[type="range"]::-moz-range-thumb{
  width:15px;
  height:15px;
  border:0;
  border-radius:50%;
  background:var(--skin-accent);
  box-shadow:0 0 8px var(--skin-glow);
  cursor:pointer;
}
.preset-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.preset-btn,
.skin-btn,
.quality-select{
  width:100%;
  min-width:0;
  min-height:36px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 9px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  cursor:pointer;
  touch-action:manipulation;
}
.preset-btn:active,
.skin-btn:active{
  transform:scale(.98);
}
.preset-btn:hover,
.skin-btn:hover,
.quality-select:hover{
  background:rgba(255,255,255,.15);
  border-color:var(--skin-accent);
}
.preset-btn:focus-visible,
.skin-btn:focus-visible,
.quality-select:focus-visible{
  outline:2px solid var(--skin-accent);
  outline-offset:1px;
}
.skin-btn{
  justify-content:flex-start;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.quality-select{
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  padding-right:30px;
  background-color:rgba(255,255,255,.08);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:13px;
}
.quality-select option{
  background:#111;
  color:#fff;
}
.skin-btn.active{
  border-color:var(--skin-accent);
  background:rgba(255,255,255,.2);
  font-weight:700;
  box-shadow:inset 0 0 6px var(--skin-glow);
}
.skin-dot{
  width:9px;
  height:9px;
  flex:0 0 9px;
  border-radius:50%;
  box-shadow:0 0 5px currentColor;
}
.switch-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:30px;
  color:#fff;
  font-size:11px;
  cursor:pointer;
}
.switch-label>span:first-child{
  min-width:0;
}
.switch{
  position:relative;
  display:inline-block;
  width:34px;
  height:18px;
  flex:0 0 34px;
}
.switch input{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
}
.slider{
  position:absolute;
  inset:0;
  border-radius:20px;
  background-color:rgba(255,255,255,.25);
  cursor:pointer;
  transition:.22s;
}
.slider:before{
  position:absolute;
  left:3px;
  bottom:3px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  content:"";
  transition:.22s;
}
.switch input:checked + .slider{
  background-color:var(--skin-accent);
  box-shadow:0 0 8px var(--skin-glow);
}
.switch input:checked + .slider:before{
  background:#000;
  transform:translateX(16px);
}
[data-player] .media-control,
[data-player] .media-control-layer,
[data-player] .media-control-layer[data-controls]{
  background:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
  filter:none!important;
  -webkit-filter:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
[data-player] .media-control .media-control-layer[data-controls] .bar-fill[data-seekbar]{
  background:var(--skin-accent)!important;
  box-shadow:0 0 10px var(--skin-glow)!important;
}
[data-player] .media-control .media-control-layer[data-controls] .bar-scrubber[data-seekbar] .bar-scrubber-icon{
  background:var(--skin-accent)!important;
  box-shadow:0 0 12px var(--skin-glow)!important;
  border-radius:50%!important;
}
[data-player] .media-control .media-control-layer[data-controls] .bar-background[data-seekbar]{
  background:rgba(255,255,255,.22)!important;
}
[data-player] .media-control .media-control-layer[data-controls] .bar-fill[data-volume]{
  background:var(--skin-accent)!important;
  box-shadow:0 0 8px var(--skin-glow)!important;
}
[data-player] .media-control .media-control-layer[data-controls] .bar-scrubber[data-volume] .bar-scrubber-icon{
  background:var(--skin-accent)!important;
  box-shadow:0 0 8px var(--skin-glow)!important;
}
[data-player] .media-control-button svg path,
[data-player] .media-control-button svg polygon,
[data-player] .media-control-button svg rect,
[data-player] .media-control-button svg circle{
  fill:#fff!important;
  stroke:#fff!important;
}
[data-player] .media-control-button:hover svg path,
[data-player] .media-control-button:hover svg polygon,
[data-player] .media-control-button:hover svg rect,
[data-player] .media-control-button:hover svg circle,
[data-player] .media-control-button:focus-visible svg path,
[data-player] .media-control-button:focus-visible svg polygon,
[data-player] .media-control-button:focus-visible svg rect,
[data-player] .media-control-button:focus-visible svg circle{
  fill:var(--skin-accent-hover)!important;
  stroke:var(--skin-accent-hover)!important;
  filter:drop-shadow(0 0 6px var(--skin-glow))!important;
}
[data-player] .media-control,
[data-player] .media-control .media-control-button,
[data-player] .media-control .media-control-text,
[data-player] .media-control .media-control-time,
[data-player] .media-control .media-control-layer[data-controls] .media-control-text{
  color:#fff!important;
}
[data-player] .media-control .live,
[data-player] .media-control [class*="live"]{
  color:var(--skin-accent)!important;
}
[data-player] .level_selector[data-level-selector] ul{
  max-height:min(35vh,200px)!important;
  overflow-y:auto!important;
  padding:5px!important;
  border:1px solid var(--skin-accent)!important;
  border-radius:10px!important;
  background:var(--skin-card)!important;
}
[data-player] .level_selector[data-level-selector] ul li a{
  padding:5px 8px!important;
  border-radius:5px!important;
  color:rgba(255,255,255,.86)!important;
  font-size:11px!important;
}
[data-player] .level_selector[data-level-selector] ul li a:hover,
[data-player] .level_selector[data-level-selector] ul li.active a{
  background:var(--skin-accent)!important;
  color:#000!important;
}
#uyarikutu{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(0,0,0,.92);
  text-align:center;
}
#uyari-inner{
  max-width:440px;
  padding:28px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  background:var(--skin-card);
  box-shadow:0 30px 80px rgba(0,0,0,.8);
}
#uyari-inner h2{
  margin-bottom:10px;
  color:var(--skin-accent);
  font-size:18px;
}
#uyari-mesaj{
  white-space:pre-line;
  color:rgba(255,255,255,.7);
  font-size:13px;
  line-height:1.6;
}
@media(max-width:480px){
  #pip-top-btn{
    top:9px;
    left:9px;
    min-width:42px;
    height:31px;
    padding:0 9px;
    font-size:10px;
    border-radius:9px;
  }

<script>
const PLAYER_SECURITY_CONFIG=Object.freeze({
  allowedHost:'talhas.stream.site.je',
  allowedOrigin:'https://talhas.stream.site.je',
  requireHttps:true,
  requireIframe:true,
  blockUnauthorizedEmbedding:true,
  requireTrustedReferrer:true,
  heartbeatMs:1200
});

const LINK_OBFUSCATION_KEY=37;

function decodeProtectedLink(value){
  try{
    const binary=atob(String(value||''));
    const bytes=new Uint8Array(binary.length);

    for(let i=0;i<binary.length;i++){
      bytes[i]=binary.charCodeAt(i);
    }

    for(let i=0;i<bytes.length;i++){
      bytes[i]=bytes[i]^LINK_OBFUSCATION_KEY^((i*11)&255);
    }

    return new TextDecoder().decode(bytes);
  }catch(e){
    return '';
  }
}

function normalizeSecurityHost(value){
  return String(value||'')
    .trim()
    .toLowerCase()
    .replace(/\.$/,'');
}

function normalizeSecurityOrigin(value){
  try{
    return new URL(String(value||'')).origin.toLowerCase();
  }catch(e){
    return '';
  }
}

function isAuthorizedAncestorChain(){
  try{
    const topOrigin=normalizeSecurityOrigin(
      window.top.location.origin
    );

    if(topOrigin!==PLAYER_SECURITY_CONFIG.allowedOrigin){
      return false;
    }
  }catch(e){
    return false;
  }

  try{
    const ancestors=window.location.ancestorOrigins;

    if(ancestors && ancestors.length){
      for(const origin of ancestors){
        if(
          normalizeSecurityOrigin(origin)!==
          PLAYER_SECURITY_CONFIG.allowedOrigin
        ){
          return false;
        }
      }
    }
  }catch(e){
    return false;
  }

  return true;
}

function isTrustedPlayerReferrer(){
  const referrer=String(document.referrer||'').trim();

  if(!referrer){
    return false;
  }

  const origin=normalizeSecurityOrigin(referrer);

  return origin===PLAYER_SECURITY_CONFIG.allowedOrigin;
}

function isAllowedPlayerDomain(){
  const locationObject=window.location;

  const host=normalizeSecurityHost(
    locationObject.hostname
  );

  if(
    host!==normalizeSecurityHost(
      PLAYER_SECURITY_CONFIG.allowedHost
    )
  ){
    return false;
  }

  if(
    PLAYER_SECURITY_CONFIG.requireHttps &&
    locationObject.protocol!=='https:'
  ){
    return false;
  }

  if(
    normalizeSecurityOrigin(locationObject.href)!==
    PLAYER_SECURITY_CONFIG.allowedOrigin
  ){
    return false;
  }

  if(
    PLAYER_SECURITY_CONFIG.blockUnauthorizedEmbedding
  ){
    const isFramed=window.top!==window.self;

    if(
      PLAYER_SECURITY_CONFIG.requireIframe &&
      !isFramed
    ){
      return false;
    }

    if(!isFramed){
      return false;
    }

    if(!isAuthorizedAncestorChain()){
      return false;
    }

    if(
      PLAYER_SECURITY_CONFIG.requireTrustedReferrer &&
      !isTrustedPlayerReferrer()
    ){
      return false;
    }
  }

  return true;
}

function showSecurityBlock(){
  const blocker=document.getElementById(
    'security-blocker'
  );

  if(blocker){
    blocker.classList.add('active');
    blocker.setAttribute(
      'aria-hidden',
      'false'
    );
  }

  document.documentElement.style.pointerEvents='none';

  try{
    document.documentElement.style.userSelect='none';
  }catch(e){}
}

function stopProtectedPlayback(){
  try{
    if(
      window.__TALHA_STREAM_PLAYER_INSTANCE__ &&
      window.__TALHA_STREAM_PLAYER_INSTANCE__.player &&
      typeof window.__TALHA_STREAM_PLAYER_INSTANCE__.player.stop==='function'
    ){
      window.__TALHA_STREAM_PLAYER_INSTANCE__.player.stop();
    }
  }catch(e){}

  try{
    const container=document.getElementById(
      'player-container'
    );

    if(container){
      container.style.visibility='hidden';
      container.style.pointerEvents='none';
    }
  }catch(e){}

  try{
    const frame=document.getElementById(
      'pph-fallback-frame'
    );

    if(frame){
      frame.src='about:blank';
    }
  }catch(e){}

  try{
    const layer=document.getElementById(
      'pph-fallback-layer'
    );

    layer?.classList.remove('active');
  }catch(e){}
}

let securityWatchdogTimer=0;
let autoHideTimer=null;
let overlayMoveStamp=0;
let videoFilterFrame=0;
let lastAppliedFilter='';
let videoScanTimer=0;

const warmupHosts=new Set();

function showOverlayButtons(){
  const pipBtn=document.getElementById('pip-top-btn');
  const settingsBtn=document.getElementById('settings-toggle-btn');

  if(pipBtn){
    pipBtn.classList.remove('fade-hidden');

function hideOverlayButtons(){

  if(drawer && drawer.classList.contains('open')){
    return;

  const pipBtn=document.getElementById('pip-top-btn');
  const settingsBtn=document.getElementById('settings-toggle-btn');

  if(pipBtn){
    pipBtn.classList.add('fade-hidden');
  }

  if(settingsBtn){
    settingsBtn.classList.add('fade-hidden');
  }
}

function resetControlsTimer(){
  showOverlayButtons();

  if(autoHideTimer){
    clearTimeout(autoHideTimer);
  }

  autoHideTimer=setTimeout(()=>{
    hideOverlayButtons();
  },4000);
}

function handleOverlayActivity(){
  const now=performance.now();

  if(now-overlayMoveStamp<120){
    return;
  }

  overlayMoveStamp=now;
  resetControlsTimer();
}

document.addEventListener('pointerdown',resetControlsTimer,{passive:true});
document.addEventListener('touchstart',resetControlsTimer,{passive:true});
document.addEventListener('click',resetControlsTimer,{passive:true});
document.addEventListener('pointermove',handleOverlayActivity,{passive:true});

function hidePoster(){
  const poster=document.getElementById('custom-poster-overlay');

  if(poster && !poster.classList.contains('hidden')){
    poster.classList.add('hidden');
  }
}

function hideLoadingIndicator(){
  const loading=document.getElementById('player-loading-indicator');

  if(loading && !loading.classList.contains('hide')){
    loading.classList.add('hide');
  }
}

function showLoadingIndicator(){
  const loading=document.getElementById('player-loading-indicator');

  if(loading){
    loading.classList.remove('hide');
  }
}

function warmConnection(hostname){
  const host=String(hostname||'').trim().toLowerCase();

  if(!host || warmupHosts.has(host)){
    return;
  }

  warmupHosts.add(host);

  try{
    const dns=document.createElement('link');
    dns.rel='dns-prefetch';
    dns.href='//'+host;
    document.head.appendChild(dns);
  }catch(e){}

  try{
    const preconnect=document.createElement('link');
    preconnect.rel='preconnect';
    preconnect.href='https://'+host;
    preconnect.crossOrigin='anonymous';
    document.head.appendChild(preconnect);
  }catch(e){}
}

function warmUrl(value){
  try{
    const url=new URL(String(value||''));
    warmConnection(url.hostname);
  }catch(e){}
}

[
  decodeProtectedLink('REBXdmY8Ah4PIyU50sXY7OCv0cXXobuxTl0='),
  decodeProtectedLink('REBXdmY8Ah4PIyU50sXY7OCv0sHXobuxTl0='),
  decodeProtectedLink('REBXdmY8Ah4PIyU50sXY7OCv0sXXobuxTl0='),
  decodeProtectedLink('REBXdmY8Ah4PIyU50sXY7OCv0sfXobuxTl0='),
  decodeProtectedLink('VlpBYWh/FBgSND9vl5+R4/rz'),
  decodeProtectedLink('SE9bd3x8FBgSND8vkpOR+Ozk')
].forEach(warmConnection);

function enforcePlayerSecurity(){
  if(isAllowedPlayerDomain()){
    return true;
  }

  stopProtectedPlayback();
  showSecurityBlock();

  return false;
}

function startSecurityWatchdog(){
  if(securityWatchdogTimer){
    clearInterval(securityWatchdogTimer);
  }

  securityWatchdogTimer=setInterval(()=>{
    if(isAllowedPlayerDomain()){
      return;
    }

    stopProtectedPlayback();
    showSecurityBlock();

    clearInterval(securityWatchdogTimer);
    securityWatchdogTimer=0;
  },PLAYER_SECURITY_CONFIG.heartbeatMs);
}

(function(){

  const themes=new Set([
    'cyber',
    'netflix',
    'prime',
    'gold',
    'emerald',
    'amethyst'
  ]);

  const params=new URLSearchParams(window.location.search);

  const requestedTheme=String(
    params.get('theme')||''
  ).toLowerCase();

  const storedTheme=String(
    localStorage.getItem('player_skin_theme')||'gold'
  ).toLowerCase();

  const activeTheme=
    themes.has(requestedTheme)
      ? requestedTheme
      : themes.has(storedTheme)
        ? storedTheme
        : 'cyber';

  document.documentElement.setAttribute(
    'data-theme',
    activeTheme
  );

  document.addEventListener(
    'DOMContentLoaded',
    ()=>{

      showLoadingIndicator();

      const meta=document.querySelector(
        'meta[name="theme-color"]'
      );

      if(meta){
        meta.setAttribute(
          'content',
          getComputedStyle(
            document.documentElement
          ).getPropertyValue('--skin-bg').trim()||'#000000'
        );
      }

      const toggle=document.getElementById('settings-toggle-btn');
      const drawer=document.getElementById('control-drawer');
      const tabs=document.querySelectorAll('.tab-btn');
      const contents=document.querySelectorAll('.tab-content');
      const skins=document.querySelectorAll('.skin-btn');
      const poster=document.getElementById('custom-poster-overlay');

      poster?.addEventListener(
        'click',
        ()=>{
          const video=document.querySelector('#player-container video');

          if(video){
            tryVideoPlay(video);
          }
        }
      );

      const closeDrawer=()=>{
        drawer?.classList.remove('open');

        toggle?.setAttribute(
          'aria-expanded',
          'false'
        );

        resetControlsTimer();
      };

      const openDrawer=()=>{
        drawer?.classList.add('open');

        toggle?.setAttribute(
          'aria-expanded',
          'true'
        );

        showOverlayButtons();

        if(autoHideTimer){
          clearTimeout(autoHideTimer);
        }
      };

      skins.forEach(button=>{
        const skin=button.getAttribute('data-skin');

        if(skin===activeTheme){
          button.classList.add('active');
        }

        button.addEventListener(
          'click',
          ()=>{

            if(!themes.has(skin)){
              return;
            }

            document.documentElement.setAttribute(
              'data-theme',
              skin
            );

            localStorage.setItem(
              'player_skin_theme',
              skin
            );

            if(meta){
              meta.setAttribute(
                'content',
                getComputedStyle(
                  document.documentElement
                ).getPropertyValue('--skin-bg').trim()||'#000000'
              );
            }

            skins.forEach(item=>{
              item.classList.toggle(
                'active',
                item===button
              );
            });
          }
        );
      });

      toggle?.setAttribute(
        'aria-expanded',
        'false'
      );

      toggle?.setAttribute(
        'aria-controls',
        'control-drawer'
      );

      toggle?.addEventListener(
        'click',
        event=>{
          event.stopPropagation();

          drawer?.classList.contains('open')
            ? closeDrawer()
            : openDrawer();
        }
      );

      document.addEventListener(
        'pointerdown',
        event=>{

          if(!drawer?.classList.contains('open')){
            return;
          }

          const target=event.target;

          if(target!==toggle && !drawer.contains(target)){
            closeDrawer();
          }
        },
        {passive:true}
      );

      document.addEventListener(
        'keydown',
        event=>{
          if(event.key==='Escape'){
            closeDrawer();
          }
        }
      );

      tabs.forEach(tab=>{
        tab.addEventListener(
          'click',
          ()=>{
            const id=tab.getAttribute('data-tab');

            tabs.forEach(item=>{
              item.classList.remove('active');
            });

            contents.forEach(item=>{
              item.classList.remove('active');
            });

            tab.classList.add('active');

            document
              .getElementById(id)
              ?.classList.add('active');

            drawer?.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }
        );
      });

      initAudioVideoFx();
    }
  );

})();

let videoSettings={
  brightness:Number(
    localStorage.getItem('player_brightness')||100
  ),
  contrast:Number(
    localStorage.getItem('player_contrast')||100
  ),
  saturate:Number(
    localStorage.getItem('player_saturate')||100
  )
};

let audioSettings={
  gain:Number(
    localStorage.getItem('player_gain')||100
  ),
  bass:
    localStorage.getItem('player_bass')==='1',
  vocal:
    localStorage.getItem('player_vocal')==='1'
};

let audioCtx=null;
let mediaSource=null;
let gainNode=null;
let bassFilter=null;
let vocalFilter=null;
let audioVideo=null;
let videoObserver=null;
let videoEventCleanup=null;
let boundVideo=null;
let audioUnlocked=false;
let audioUserMuted=true;
let audioUserVolume=100;
let autoplayTimers=[];

function clearAutoplayTimers(){
  autoplayTimers.forEach(timer=>{
    try{
      clearTimeout(timer);
    }catch(e){}
  });

  autoplayTimers=[];
}

function scheduleAutoplay(delay){
  const timer=setTimeout(
    forceAutoplay,
    delay
  );

  autoplayTimers.push(timer);
}

function clampNumber(
  value,
  min,
  max,
  fallback
){
  const n=Number(value);

  return Number.isFinite(n)
    ? Math.min(
        max,
        Math.max(
          min,
          n
        )
      )
    : fallback;
}

videoSettings.brightness=clampNumber(
  videoSettings.brightness,
  60,
  180,
  100
);

videoSettings.contrast=clampNumber(
  videoSettings.contrast,
  60,
  180,
  100
);

videoSettings.saturate=clampNumber(
  videoSettings.saturate,
  0,
  220,
  100
);

audioSettings.gain=clampNumber(
  audioSettings.gain,
  100,
  300,
  100
);

function applyVideoFilters(){

  if(videoFilterFrame){
    return;
  }

  videoFilterFrame=requestAnimationFrame(()=>{
    videoFilterFrame=0;

    const video=document.querySelector(
      '#player-container video'
    );

    if(!video){
      return;
    }

    const filter=
      videoSettings.brightness===100 &&
      videoSettings.contrast===100 &&
      videoSettings.saturate===100
        ? 'none'
        : `brightness(${videoSettings.brightness}%) contrast(${videoSettings.contrast}%) saturate(${videoSettings.saturate}%)`;

    if(filter===lastAppliedFilter){
      return;
    }

    lastAppliedFilter=filter;

    try{
      video.style.setProperty(
        'filter',
        filter,
        'important'
      );
    }catch(e){
      video.style.filter=filter;
    }
  });
}

function updateVideoUI(){

  const items=[
    [
      'slider-brightness',
      'val-brightness',
      videoSettings.brightness
    ],
    [
      'slider-contrast',
      'val-contrast',

    ],

    ]
  ];

  items.forEach(
    ([inputId,labelId,value])=>{

      const input=document.getElementById(inputId);
      const label=document.getElementById(labelId);

      if(input){
        input.value=value;
      }

      if(label){
        label.textContent=value+'%';
      }
    }

}

function updateAudioUI(){

  const gain=document.getElementById('slider-gain');
  const gainLabel=document.getElementById('val-gain');
  const bass=document.getElementById('toggle-bass');
  const vocal=document.getElementById('toggle-vocal');

  if(gain){
    gain.value=audioSettings.gain;
  }

  if(gainLabel){
    gainLabel.textContent=audioSettings.gain+'%';
  }

  }

  }
}

function updateUnmuteButtonState(){

  const button=document.getElementById(
    'unmute-overlay-btn'
  );

  if(!button){
    return;
  }

  const shouldHide=
    audioUnlocked &&
    !audioUserMuted &&
    audioUserVolume>0;

  button.classList.toggle(
    'hidden',
    shouldHide
  );
}

function updateVideoParams(
  brightness,
  contrast,
  saturate
){

  videoSettings={
    brightness:clampNumber(
      brightness,
      60,
      180,
      100
    ),
    contrast:clampNumber(
      contrast,
      60,
      180,
      100
    ),
    saturate:clampNumber(
      saturate,
      0,
      220,
      100
    )
  };

  localStorage.setItem(
    'player_brightness',
    videoSettings.brightness
  );

  localStorage.setItem(
    'player_contrast',
    videoSettings.contrast
  );

  localStorage.setItem(
    'player_saturate',
    videoSettings.saturate
  );

  updateVideoUI();
  applyVideoFilters();
}

function applyAudioSettings(){

  if(!gainNode || !bassFilter || !vocalFilter){
    return;
  }

  try{
    gainNode.gain.value=audioSettings.gain/100;

    bassFilter.gain.value=
      audioSettings.bass ? 10 : 0;

    vocalFilter.gain.value=
      audioSettings.vocal ? 6 : 0;
  }catch(e){}
}

async function resumeAudioContext(){

  if(!audioCtx){
    return;
  }

  try{
    if(audioCtx.state==='suspended'){
      await audioCtx.resume();
    }
  }catch(e){}
}

function disconnectAudioGraph(){

  try{
    mediaSource?.disconnect();
  }catch(e){}

  try{
    bassFilter?.disconnect();
  }catch(e){}

  try{
    vocalFilter?.disconnect();
  }catch(e){}

  try{
    gainNode?.disconnect();
  }catch(e){}
}

function setupAudioNodes(){

  const video=document.querySelector(
    '#player-container video'
  );

  if(!video){
    return false;
  }

  const needsEnhancer=
    audioSettings.gain!==100 ||
    audioSettings.bass ||
    audioSettings.vocal;

  if(!needsEnhancer){
    applyDesiredAudioState(video);
    return true;
  }

  try{

    const AudioContextClass=
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){
      return false;
    }

    if(!audioCtx){
      audioCtx=new AudioContextClass();
    }

    if(
      audioVideo===video &&
      mediaSource
    ){

      applyAudioSettings();

      if(audioUnlocked){
        resumeAudioContext();
      }

      return true;
    }

    disconnectAudioGraph();

    mediaSource=null;
    gainNode=null;
    bassFilter=null;
    vocalFilter=null;

    const source=
      audioCtx.createMediaElementSource(
        video
      );

    const gain=
      audioCtx.createGain();

    const bass=
      audioCtx.createBiquadFilter();

    const vocal=
      audioCtx.createBiquadFilter();

    bass.type='lowshelf';
    bass.frequency.value=150;

    vocal.type='peaking';
    vocal.frequency.value=2500;
    vocal.Q.value=1;

    source.connect(bass);
    bass.connect(vocal);
    vocal.connect(gain);
    gain.connect(audioCtx.destination);

    mediaSource=source;
    gainNode=gain;
    bassFilter=bass;
    vocalFilter=vocal;
    audioVideo=video;

    applyAudioSettings();

    if(audioUnlocked){
      resumeAudioContext();
    }

    return true;

  }catch(e){

    console.warn(
      'Audio enhancer unavailable:',
      e
    );

    return false;
  }
}

function applyDesiredAudioState(video){

  if(!video){
    return;
  }

  try{

    if(!audioUnlocked){

      video.muted=true;
      video.defaultMuted=true;
      video.volume=0;

      video.setAttribute(
        'muted',
        ''
      );

    }else{

      const muted=
        audioUserMuted ||
        audioUserVolume<=0;

      video.muted=muted;
      video.defaultMuted=muted;

      video.volume=
        muted
          ? 0
          : Math.max(
              0,
              Math.min(
                1,
                audioUserVolume/100
              )
            );

      if(muted){
        video.setAttribute('muted','');
      }else{
        video.removeAttribute('muted');
      }
    }

    video.autoplay=true;
    video.playsInline=true;

    video.setAttribute('autoplay','');
    video.setAttribute('playsinline','');
    video.setAttribute('webkit-playsinline','');
    video.setAttribute('x5-playsinline','true');

  }catch(e){}

  updateUnmuteButtonState();
}

function syncAudioFromPlayer(volume){

  const value=clampNumber(
    volume,
    0,
    100,
    audioUserVolume
  );

  if(value>0){

    audioUnlocked=true;
    audioUserMuted=false;
    audioUserVolume=value;

  }else if(audioUnlocked){

    audioUserMuted=true;
  }

  const video=document.querySelector(
    '#player-container video'
  );

  if(video && audioUnlocked){

    try{

      const muted=
        audioUserMuted ||
        audioUserVolume<=0;

      video.muted=muted;
      video.defaultMuted=muted;

      if(muted){

        video.volume=0;
        video.setAttribute(
          'muted',
          ''
        );

      }else{

        video.volume=Math.max(
          0,
          Math.min(
            1,
            audioUserVolume/100
          )
        );

        video.removeAttribute(
          'muted'
        );
      }

    }catch(e){}
  }

  updateUnmuteButtonState();
}

function syncVideoVolumeState(video){

  if(!video){
    return;
  }

  try{

    const value=clampNumber(
      video.volume*100,
      0,
      100,
      audioUserVolume
    );

    if(value>0){
      audioUserVolume=value;
    }

    if(!video.muted && value>0){

      audioUnlocked=true;
      audioUserMuted=false;

    }else if(audioUnlocked){

      audioUserMuted=true;
    }

    updateUnmuteButtonState();

  }catch(e){}
}

function syncClapprToCurrentAudio(){

  const player=
    window.activeStreamPlayer?.player;

  if(!player){
    return;
  }

  try{

    if(
      typeof player.setVolume==='function'
    ){
      player.setVolume(
        clampNumber(
          audioUserVolume,
          0,
          100,
          100
        )
      );
    }

  }catch(e){}

  try{

    if(
      typeof player.unmute==='function'
    ){
      player.unmute();
    }

  }catch(e){}
}

function unmuteEverything(){

  audioUnlocked=true;
  audioUserMuted=false;
  audioUserVolume=100;

  clearAutoplayTimers();

  const button=document.getElementById(
    'unmute-overlay-btn'
  );

  const video=document.querySelector(
    '#player-container video'
  );

  const activePlayer=
    window.activeStreamPlayer?.player;

  if(
    audioSettings.gain!==100 ||
    audioSettings.bass ||
    audioSettings.vocal
  ){
    setupAudioNodes();
  }

  if(audioCtx){

    try{

      const result=audioCtx.resume();

      if(
        result &&
        typeof result.catch==='function'
      ){
        result.catch(()=>{});
      }

    }catch(e){}
  }

  try{

    if(
      activePlayer &&
      typeof activePlayer.setVolume==='function'
    ){
      activePlayer.setVolume(100);
    }

  }catch(e){}

  try{

    if(
      activePlayer &&
      typeof activePlayer.unmute==='function'
    ){
      activePlayer.unmute();
    }

  }catch(e){}

  if(video){

    try{

      video.muted=false;
      video.defaultMuted=false;
      video.volume=1;

      video.removeAttribute(
        'muted'
      );

      video.autoplay=true;
      video.playsInline=true;

      video.setAttribute(
        'autoplay',
        ''
      );

      video.setAttribute(
        'playsinline',
        ''
      );

      video.setAttribute(
        'webkit-playsinline',
        ''
      );

      video.setAttribute(
        'x5-playsinline',
        'true'
      );

    }catch(e){}

    try{

      const result=video.play();

      if(
        result &&
        typeof result.catch==='function'
      ){
        result.catch(()=>{});
      }

    }catch(e){}
  }

  hidePoster();
  hideLoadingIndicator();

  if(button){
    button.classList.add('hidden');
  }

  updateUnmuteButtonState();
}

function bindCurrentVideo(video){

  if(!video){
    return;
  }

  if(boundVideo===video){

    applyDesiredAudioState(video);
    applyVideoFilters();

    if(
      audioSettings.gain!==100 ||
      audioSettings.bass ||
      audioSettings.vocal
    ){
      setupAudioNodes();
    }

    return;
  }

  if(videoEventCleanup){
    videoEventCleanup();
  }

  boundVideo=video;
  applyDesiredAudioState(video);

  const handleMeta=()=>{

    applyDesiredAudioState(video);
    applyVideoFilters();

    if(
      audioSettings.gain!==100 ||
      audioSettings.bass ||
      audioSettings.vocal
    ){
      setupAudioNodes();
    }
  };

  const handleCanPlay=()=>{

    applyDesiredAudioState(video);
    applyVideoFilters();
    tryVideoPlay(video);
  };

  const handlePlaying=()=>{

    hidePoster();
    hideLoadingIndicator();
    applyVideoFilters();

    window.activeStreamPlayer?.updatePipButton?.();
  };

  const handleTimeUpdate=()=>{

    if(video.currentTime>0){

      hidePoster();
      hideLoadingIndicator();
    }
  };

  const handleVolumeChange=()=>{

    syncVideoVolumeState(video);

    if(audioUnlocked){
      applyDesiredAudioState(video);
    }
  };

  const handleVideoError=()=>{

    const player=window.activeStreamPlayer;

    if(
      player &&
      player.isPphEligible() &&
      !player.pphFallbackUsed
    ){

      player.showPphFallbackIframe();

    }else if(player){

      player.handlePlaybackError();
    }
  };

  video.addEventListener(
    'loadedmetadata',
    handleMeta,
    {passive:true}
  );

  video.addEventListener(
    'loadeddata',
    handleMeta,
    {passive:true}
  );

  video.addEventListener(
    'canplay',
    handleCanPlay,
    {passive:true}
  );

  video.addEventListener(
    'playing',
    handlePlaying,
    {passive:true}
  );

  video.addEventListener(
    'timeupdate',
    handleTimeUpdate,
    {passive:true}
  );

  video.addEventListener(
    'volumechange',
    handleVolumeChange,
    {passive:true}
  );

  video.addEventListener(
    'error',
    handleVideoError,
    {passive:true}
  );

  videoEventCleanup=()=>{

    try{

      video.removeEventListener(
        'loadedmetadata',
        handleMeta
      );

      video.removeEventListener(
        'loadeddata',
        handleMeta
      );

      video.removeEventListener(
        'canplay',
        handleCanPlay
      );

      video.removeEventListener(
        'playing',
        handlePlaying
      );

      video.removeEventListener(
        'timeupdate',
        handleTimeUpdate
      );

      video.removeEventListener(
        'volumechange',
        handleVolumeChange
      );

      video.removeEventListener(
        'error',
        handleVideoError
      );

    }catch(e){}
  };

  applyVideoFilters();

  if(audioUnlocked){
    applyDesiredAudioState(video);
  }else{
    tryVideoPlay(video);
  }
}

function tryVideoPlay(video){

  if(!video){
    return Promise.resolve(false);
  }

  applyDesiredAudioState(video);

  try{

    const promise=video.play();

    if(
      promise &&
      typeof promise.then==='function'
    ){

      return promise.then(
        ()=>{
          hidePoster();
          hideLoadingIndicator();
          return true;
        }
      ).catch(
        ()=>false
      );
    }

    if(!video.paused){

      hidePoster();
      hideLoadingIndicator();

      return Promise.resolve(true);
    }

  }catch(e){}

  return Promise.resolve(false);
}

function forceAutoplay(){

  const video=document.querySelector(
    '#player-container video'
  );

  if(!video){
    return false;
  }

  if(audioUnlocked){

    applyDesiredAudioState(video);

  }else{

    video.muted=true;
    video.defaultMuted=true;
    video.volume=0;

    video.setAttribute(
      'muted',
      ''
    );
  }

  tryVideoPlay(video);

  return true;
}

function startAutoplayRetries(){

  clearAutoplayTimers();

  scheduleAutoplay(40);
  scheduleAutoplay(180);
  scheduleAutoplay(500);
  scheduleAutoplay(1100);
  scheduleAutoplay(1800);
}

function bindVideoIfAvailable(){

  const container=document.getElementById(
    'player-container'
  );

  if(!container){
    return;
  }

  const video=container.querySelector('video');

  if(
    !video ||
    video===boundVideo
  ){
    return;
  }

  bindCurrentVideo(video);

  if(audioUnlocked){

    applyDesiredAudioState(video);

  }else{

    startAutoplayRetries();
  }
}

function scheduleVideoScan(){

  if(videoScanTimer){
    return;
  }

  videoScanTimer=setTimeout(
    ()=>{
      videoScanTimer=0;
      bindVideoIfAvailable();
    },
    80
  );
}

function observePlayerVideo(){

  const container=document.getElementById(
    'player-container'
  );

  if(!container){
    return;
  }

  videoObserver?.disconnect();

  videoObserver=new MutationObserver(
    ()=>{
      scheduleVideoScan();
    }
  );

  videoObserver.observe(
    container,
    {
      childList:true,
      subtree:true
    }
  );

  bindVideoIfAvailable();
}

function initAudioVideoFx(){

  const brightness=document.getElementById(
    'slider-brightness'
  );

    'slider-contrast'
  );

  const saturate=document.getElementById(

    'input',
    event=>{

      videoSettings.contrast=
        clampNumber(
          event.target.value,

          180,
          100
        );

        'val-contrast'
      ).textContent=

      localStorage.setItem(

        videoSettings.contrast
      );

      applyVideoFilters();
    }
  );

  saturate?.addEventListener(
    'input',
    event=>{

      videoSettings.saturate=
        clampNumber(
          event.target.value,

          220,
          100
        );

      document.getElementById(
        'val-saturate'
      ).textContent=
        videoSettings.saturate+'%';

      localStorage.setItem(

      );

    }

  document.getElementById(

      );
    }

  document.getElementById(
    'btn-cinema'

        100,
        110,
        105
      );
    }
  );

  document.getElementById(
    'btn-night'
  )?.addEventListener(
    'click',
    ()=>{
      updateVideoParams(
        125,
        105,
        95
      );
    }
  );

  document.getElementById(
    'btn-vreset'
  )?.addEventListener(
    'click',
    ()=>{
      updateVideoParams(
        100,
        100,
        100
      );
    }
  );

  gain?.addEventListener(
    'input',
    event=>{

      audioSettings.gain=
        clampNumber(
          event.target.value,
          100,
          300,
          100
        );

      document.getElementById(
        'val-gain'
      ).textContent=
        audioSettings.gain+'%';

      localStorage.setItem(
        'player_gain',
        audioSettings.gain
      );

      setupAudioNodes();
      applyAudioSettings();

      if(audioUnlocked){
        resumeAudioContext();
      }
    }
  );

  bass?.addEventListener(
    'change',
    event=>{

      audioSettings.bass=
        !!event.target.checked;

let feedScriptPromise=null;

function loadFeedScript(){

  if(
    Array.isArray(
      window.karsilasmalar
    )
  ){

    return Promise.resolve(
      window.karsilasmalar
    );
  }

  if(feedScriptPromise){
    return feedScriptPromise;
  }

  feedScriptPromise=new Promise(
    (resolve,reject)=>{

      const existing=document.getElementById(
        'dynamic-feed-script'
      );

      const finish=()=>{

        if(
          Array.isArray(
            window.karsilasmalar
          )
        ){

          resolve(
            window.karsilasmalar
          );

        }else{

          reject(
            new Error(
              'Feed Vector Missing'
            )
          );
        }
      };

      if(existing){

        existing.addEventListener(
          'load',
          finish,
          {once:true}
        );

        existing.addEventListener(
          'error',
          ()=>{
            reject(
              new Error(
                'Feed Load Failed'
              )
            );
          },
          {once:true}
        );

        setTimeout(
          finish,
          3000
        );

        return;
      }

      const script=document.createElement(
        'script'
      );

      script.id='dynamic-feed-script';

      script.src=
        decodeProtectedLink('TVpHdHooSEcQJyMv1MTM8Prsl4fK+/mgVEwUf3JoBgAxen3O2g==');

      script.async=true;

      script.onload=finish;

      script.onerror=()=>{
        reject(
          new Error(
            'Feed Load Failed'
          )
        );
      };

      document.head.appendChild(
        script
      );

      setTimeout(
        finish,
        3000
      );
    }
  );

  return feedScriptPromise;
}

function findFeedEvent(events,key){

  const target=normalizeInputId(key);

  if(
    !target ||
    !Array.isArray(events)
  ){
    return null;
  }

  return events.find(
    event=>{

      const candidates=[
        event?.id,
        event?.channelId,
        event?.channel,
        event?.name,
        event?.title,
        event?.url,
        event?.streamUrl,
        event?.link
      ].map(
        item=>String(item||'')
      );

      return candidates.some(
        value=>{

          if(value===target){
            return true;
          }

          try{

            const u=new URL(
              value,
              window.location.href
            );

            return(
              u.searchParams.get('id')===
              target
            );

          }catch(e){

            return false;
          }
        }
      );
    }
  )||null;
}

async function resolveFeedSource(value){

  const key=extractIdFromUrl(value);

  if(!key){
    return null;
  }

  try{

    const events=await loadFeedScript();

    const event=findFeedEvent(
      events,
      key
    );

    if(!event){
      return null;
    }

    const candidates=[
      event.streamUrl,
      event.stream_url,
      event.url,
      event.link,
      event.source,
      event.src
    ]
    .map(
      item=>String(item||'').trim()
    )
    .filter(Boolean);

    const m3u=candidates.find(
      value=>/\.m3u8(?:$|[?#])/i.test(value)
    );

    if(m3u){
      return m3u;
    }

    return(
      extractIdFromUrl(
        candidates.find(
          value=>/id=/i.test(value)
        ) ||
        event.id ||
        key
      ) ||
      key
    );

  }catch(e){

    console.warn(
      'Feed lookup failed:',
      e
    );

    return null;
  }
}

async function probeUrl(
  url,
  timeout=1800
){

  const controller=
    typeof AbortController!=='undefined'
      ? new AbortController()
      : null;

  const timer=
    controller
      ? setTimeout(
          ()=>{
            try{
              controller.abort();
            }catch(e){}
          },
          timeout
        )
      : null;

  try{

    const response=await fetch(
      url,
      {
        method:'GET',
        mode:'cors',
        cache:'no-store',
        credentials:'omit',
        redirect:'follow',
        signal:controller?.signal
      }
    );

    const ok=!!response.ok;

    try{
      await response.body?.cancel();
    }catch(e){}

    return ok;

  }catch(e){

    return false;

  }finally{

    if(timer){
      clearTimeout(timer);
    }
  }
}

async function resolveChecklistSource(
  id,
  timeout=1800
){

  const candidates=getChecklistCandidates(id);

  if(!candidates.length){
    return null;
  }

  return new Promise(
    resolve=>{

      let finished=false;

      const timer=setTimeout(
        ()=>{
          if(!finished){
            finished=true;
            resolve(null);
          }
        },
        timeout
      );

      candidates.forEach(
        (url,index)=>{

          probeUrl(
            url,
            timeout
          ).then(
            ok=>{

              if(
                finished ||
                !ok
              ){
                return;
              }

              finished=true;

              clearTimeout(timer);

              resolve({
                url,
                index
              });
            }
          ).catch(
            ()=>{}
          );
        }
      );
    }
  );
}

function firstUsable(
  promises,
  timeout=2600
){

  return new Promise(
    resolve=>{

      let done=false;
      let pending=promises.length;

      if(!pending){
        resolve(null);
        return;
      }

      const timer=setTimeout(
        ()=>{
          if(!done){
            done=true;
            resolve(null);
          }
        },
        timeout
      );

      promises.forEach(
        promise=>{

          Promise.resolve(
            promise
          )
          .then(
            value=>{

              if(
                value &&
                !done
              ){

                done=true;

                clearTimeout(timer);

                resolve(value);
              }
            }
          )
          .catch(
            ()=>{}
          )
          .finally(
            ()=>{

              pending--;

              if(
                !pending &&
                !done
              ){

                done=true;

                clearTimeout(timer);

                resolve(null);
              }
            }
          );
        }
      );
    }
  );
}

async function resolveFastDirectSource(
  input,
  id
){

  const tasks=[];

  tasks.push(
    resolveFeedSource(
      input
    )
    .then(
      source=>{

        const url=normalizeStreamUrl(
          source
        );

        return(
          url &&
          /\.m3u8(?:$|[?#])/i.test(url)
        )
          ? {
              mode:'feed',
              url
            }
          : null;
      }
    )
    .catch(
      ()=>null
    )
  );

  if(isAndroChannel(id)){

    tasks.push(
      resolveCinemaSource(
        id,
        2500
      )
      .then(
        url=>
          url
            ? {
                mode:'cinema',
                url
              }
            : null
      )
      .catch(
        ()=>null
      )
    );

    tasks.push(
      resolveChecklistSource(
        id,
        1800
      )
      .then(
        result=>
          result
            ? {
                mode:'checklist',
                url:result.url,
                index:result.index
              }
            : null
      )
      .catch(
        ()=>null
      )
    );
  }

  return firstUsable(
    tasks,
    2600
  );
}
