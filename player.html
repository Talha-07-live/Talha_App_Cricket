<!doctype html>
<html lang="en" data-theme="cyber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Talha's Player</title>
<link rel="icon" href="https://s10.gifyu.com/images/SrMU9.png">

<style>
:root[data-theme="netflix"]{
  --skin-accent:#E50914;
  --skin-accent-hover:#FF2E38;
  --skin-glow:rgba(229,9,20,.6);
  --skin-control-overlay:rgba(229,9,20,.12);
  --skin-control-shadow:rgba(229,9,20,.30);
  --skin-bg:#000;
  --skin-card:rgba(18,10,12,.94);
  --skin-text:#fff;
}

:root[data-theme="cyber"]{
  --skin-accent:#00F2FE;
  --skin-accent-hover:#4FACFE;
  --skin-glow:rgba(0,242,254,.6);
  --skin-control-overlay:rgba(0,242,254,.12);
  --skin-control-shadow:rgba(0,242,254,.30);
  --skin-bg:#030712;
  --skin-card:rgba(6,16,26,.94);
  --skin-text:#fff;
}

:root[data-theme="prime"]{
  --skin-accent:#00A8E1;
  --skin-accent-hover:#33BCEB;
  --skin-glow:rgba(0,168,225,.6);
  --skin-control-overlay:rgba(0,168,225,.12);
  --skin-control-shadow:rgba(0,168,225,.30);
  --skin-bg:#050D18;
  --skin-card:rgba(5,20,35,.94);
  --skin-text:#fff;
}

:root[data-theme="gold"]{
  --skin-accent:#FFD700;
  --skin-accent-hover:#FFE033;
  --skin-glow:rgba(255,215,0,.6);
  --skin-control-overlay:rgba(255,215,0,.12);
  --skin-control-shadow:rgba(255,215,0,.30);
  --skin-bg:#0A0905;
  --skin-card:rgba(22,19,10,.94);
  --skin-text:#fff;
}

:root[data-theme="emerald"]{
  --skin-accent:#00E676;
  --skin-accent-hover:#33EB91;
  --skin-glow:rgba(0,230,118,.6);
  --skin-control-overlay:rgba(0,230,118,.12);
  --skin-control-shadow:rgba(0,230,118,.30);
  --skin-bg:#010C06;
  --skin-card:rgba(4,22,12,.94);
  --skin-text:#fff;
}

:root[data-theme="amethyst"]{
  --skin-accent:#A855F7;
  --skin-accent-hover:#C084FC;
  --skin-glow:rgba(168,85,247,.6);
  --skin-control-overlay:rgba(168,85,247,.12);
  --skin-control-shadow:rgba(168,85,247,.30);
  --skin-bg:#08030D;
  --skin-card:rgba(18,8,28,.94);
  --skin-text:#fff;
}

:root{
  --player-control-accent:var(--skin-accent);
  --player-control-accent-hover:var(--skin-accent-hover);
  --player-control-glow:var(--skin-glow);
  --player-control-bg:var(--skin-card);
  --player-control-border:var(--skin-accent);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:var(--skin-text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  overflow:hidden;
}

body{
  touch-action:manipulation;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  background:#000;
}

#player-shell,
#player-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}

#player-container .clappr-player,
#player-container .player-poster{
  width:100%!important;
  height:100%!important;
}

#player-container video{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}

#custom-poster-overlay{
  position:absolute;
  inset:0;
  z-index:50;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#030712;
  cursor:pointer;
  user-select:none;
  transition:opacity .45s ease,visibility .45s ease;
}

#custom-poster-overlay.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#custom-poster-overlay svg{
  width:100%;
  height:100%;
  object-fit:cover;
}

#player-loading-indicator{
  position:absolute;
  left:50%;
  bottom:18px;
  z-index:3;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:154px;
  min-height:34px;
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 12px var(--skin-glow);
  opacity:1;
  visibility:visible;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility .55s ease;
}

#player-loading-indicator.hide{
  opacity:0;
  visibility:hidden;
  transform:translateX(-50%) translateY(16px) scale(.96);
  pointer-events:none;
}

#player-loading-dots{
  display:inline-block;
  width:18px;
  margin-left:3px;
  overflow:hidden;
  text-align:left;
  vertical-align:bottom;
}

#player-loading-dots::after{
  content:"";
  display:inline-block;
  animation:loadingDots 1.15s steps(4,end) infinite;
}

@keyframes loadingDots{
  0%{content:""}
  25%{content:"."}
  50%{content:".."}
  75%{content:"..."}
  100%{content:""}
}

#unmute-overlay-btn{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:5px 12px;
  border:1px solid var(--skin-accent);
  border-radius:20px;
  background:rgba(0,0,0,.86);
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.5px;
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 15px rgba(0,0,0,.6),0 0 10px var(--skin-glow);
  transition:all .22s cubic-bezier(.2,.8,.2,1);
  user-select:none;
  touch-action:manipulation;
}

#unmute-overlay-btn:hover{
  background:var(--skin-accent);
  color:#000;
  transform:translateX(-50%) scale(1.05);
  box-shadow:0 4px 18px var(--skin-glow);
}

#unmute-overlay-btn:active{
  transform:translateX(-50%) scale(.97);
}

#unmute-overlay-btn svg{
  width:12px;
  height:12px;
  fill:currentColor;
}

#unmute-overlay-btn.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateX(-50%) translateY(-10px);
}

#settings-toggle-btn{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  right:max(12px,env(safe-area-inset-right,0px));
  z-index:10000;
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  line-height:1;
  box-shadow:0 4px 18px rgba(0,0,0,.6);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s ease,box-shadow .22s ease;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

#settings-toggle-btn:hover,
#settings-toggle-btn:focus-visible{
  transform:rotate(45deg) scale(1.06);
  border-color:var(--skin-accent);
  box-shadow:0 0 18px var(--skin-glow),0 6px 18px rgba(0,0,0,.5);
  outline:none;
}

#settings-toggle-btn:active{
  transform:scale(.95);
}

#control-drawer{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 58px);
  right:max(12px,env(safe-area-inset-right,0px));
  z-index:10001;
  width:min(320px,calc(100vw - 24px));
  max-height:min(75dvh,480px);
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.25) transparent;
  background:var(--skin-card);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  padding:12px;
  display:none;
  flex-direction:column;
  gap:12px;
  box-shadow:0 16px 45px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.3);
  animation:drawerIn .2s cubic-bezier(.2,.8,.2,1);
  contain:layout paint style;
  touch-action:pan-y;
}

#control-drawer::-webkit-scrollbar{
  width:5px;
}

#control-drawer::-webkit-scrollbar-track{
  background:transparent;
}

#control-drawer::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.25);
  border-radius:10px;
}

#control-drawer.open{
  display:flex;
}

@keyframes drawerIn{
  from{
    opacity:0;
    transform:translate3d(0,-8px,0) scale(.98);
  }
  to{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
  }
}

.drawer-tabs{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  width:100%;
  flex:0 0 auto;
  gap:2px;
  padding:3px;
  background:rgba(0,0,0,.65);
  border-radius:10px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.tab-btn{
  flex:1 1 0;
  min-width:0;
  min-height:34px;
  padding:6px 4px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:rgba(255,255,255,.65);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.4px;
  cursor:pointer;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  touch-action:manipulation;
}

.tab-btn:focus-visible{
  outline:2px solid var(--skin-accent);
  outline-offset:1px;
}

.tab-btn.active{
  background:var(--skin-accent);
  color:#000;
  box-shadow:0 0 10px var(--skin-glow);
}

.tab-content{
  display:none;
  flex-direction:column;
  gap:10px;
  min-width:0;
  flex:0 0 auto;
}

.tab-content.active{
  display:flex;
}

.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:rgba(255,255,255,.55);
  font-weight:800;
}

.control-group{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:0;
}

.control-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:rgba(255,255,255,.85);
}

.control-header span:first-child{
  min-width:0;
}

.control-header span.val{
  color:var(--skin-accent);
  font-weight:700;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  display:block;
  width:100%;
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  touch-action:pan-x;
}

input[type="range"]::-webkit-slider-runnable-track{
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
}

input[type="range"]::-moz-range-track{
  height:5px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
}

input[type="range"]::-webkit-slider-thumb{
  width:15px;
  height:15px;
  margin-top:-5px;
  border:0;
  border-radius:50%;
  background:var(--skin-accent);
  box-shadow:0 0 8px var(--skin-glow);
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

input[type="range"]::-moz-range-thumb{
  width:15px;
  height:15px;
  border:0;
  border-radius:50%;
  background:var(--skin-accent);
  box-shadow:0 0 8px var(--skin-glow);
  cursor:pointer;
}

.preset-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}

.preset-btn,
.skin-btn,
.quality-select{
  width:100%;
  min-width:0;
  min-height:36px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 9px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .12s ease;
  touch-action:manipulation;
}

.preset-btn:active,
.skin-btn:active{
  transform:scale(.98);
}

.preset-btn:hover,
.skin-btn:hover,
.quality-select:hover{
  background:rgba(255,255,255,.15);
  border-color:var(--skin-accent);
}

.preset-btn:focus-visible,
.skin-btn:focus-visible,
.quality-select:focus-visible{
  outline:2px solid var(--skin-accent);
  outline-offset:1px;
}

.skin-btn{
  justify-content:flex-start;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.quality-select{
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  padding-right:30px;
  background-color:rgba(255,255,255,.08);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:13px;
}

.quality-select option{
  background:#111;
  color:#fff;
}

.skin-btn.active{
  border-color:var(--skin-accent);
  background:rgba(255,255,255,.2);
  font-weight:700;
  box-shadow:inset 0 0 6px var(--skin-glow);
}

.skin-dot{
  width:9px;
  height:9px;
  flex:0 0 9px;
  border-radius:50%;
  box-shadow:0 0 5px currentColor;
}

.switch-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:30px;
  color:#fff;
  font-size:11px;
  cursor:pointer;
}

.switch-label>span:first-child{
  min-width:0;
}

.switch{
  position:relative;
  display:inline-block;
  width:34px;
  height:18px;
  flex:0 0 34px;
}

.switch input{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
}

.slider{
  position:absolute;
  inset:0;
  border-radius:20px;
  background-color:rgba(255,255,255,.25);
  cursor:pointer;
  transition:.22s;
}

.slider:before{
  position:absolute;
  left:3px;
  bottom:3px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  content:"";
  transition:.22s;
}

.switch input:checked + .slider{
  background-color:var(--skin-accent);
  box-shadow:0 0 8px var(--skin-glow);
}

.switch input:checked + .slider:before{
  background:#000;
  transform:translateX(16px);
}

[data-player] .media-control,
[data-player] .media-control-layer,
[data-player] .media-control-layer[data-controls]{
  background:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
  filter:none!important;
  -webkit-filter:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}

[data-player] .media-control .media-control-layer[data-controls] .bar-fill[data-seekbar]{
  background:var(--skin-accent)!important;
  box-shadow:0 0 10px var(--skin-glow)!important;
}

[data-player] .media-control .media-control-layer[data-controls] .bar-scrubber[data-seekbar] .bar-scrubber-icon{
  background:var(--skin-accent)!important;
  box-shadow:0 0 12px var(--skin-glow)!important;
  border-radius:50%!important;
}

[data-player] .media-control .media-control-layer[data-controls] .bar-background[data-seekbar]{
  background:rgba(255,255,255,.22)!important;
}

[data-player] .media-control .media-control-layer[data-controls] .bar-fill[data-volume]{
  background:var(--skin-accent)!important;
  box-shadow:0 0 8px var(--skin-glow)!important;
}

[data-player] .media-control .media-control-layer[data-controls] .bar-scrubber[data-volume] .bar-scrubber-icon{
  background:var(--skin-accent)!important;
  box-shadow:0 0 8px var(--skin-glow)!important;
}

[data-player] .media-control-button svg path,
[data-player] .media-control-button svg polygon,
[data-player] .media-control-button svg rect,
[data-player] .media-control-button svg circle{
  fill:#fff!important;
  stroke:#fff!important;
}

[data-player] .media-control-button:hover svg path,
[data-player] .media-control-button:hover svg polygon,
[data-player] .media-control-button:hover svg rect,
[data-player] .media-control-button:hover svg circle,
[data-player] .media-control-button:focus-visible svg path,
[data-player] .media-control-button:focus-visible svg polygon,
[data-player] .media-control-button:focus-visible svg rect,
[data-player] .media-control-button:focus-visible svg circle{
  fill:var(--skin-accent-hover)!important;
  stroke:var(--skin-accent-hover)!important;
  filter:drop-shadow(0 0 6px var(--skin-glow))!important;
}

[data-player] .media-control,
[data-player] .media-control .media-control-button,
[data-player] .media-control .media-control-text,
[data-player] .media-control .media-control-time,
[data-player] .media-control .media-control-layer[data-controls] .media-control-text{
  color:#fff!important;
}

[data-player] .media-control .live,
[data-player] .media-control [class*="live"]{
  color:var(--skin-accent)!important;
}

[data-player] .level_selector[data-level-selector] ul{
  max-height:min(35vh,200px)!important;
  overflow-y:auto!important;
  padding:5px!important;
  border:1px solid var(--skin-accent)!important;
  border-radius:10px!important;
  background:var(--skin-card)!important;
}

[data-player] .level_selector[data-level-selector] ul li a{
  padding:5px 8px!important;
  border-radius:5px!important;
  color:rgba(255,255,255,.86)!important;
  font-size:11px!important;
}

[data-player] .level_selector[data-level-selector] ul li a:hover,
[data-player] .level_selector[data-level-selector] ul li.active a{
  background:var(--skin-accent)!important;
  color:#000!important;
}

#uyarikutu{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(0,0,0,.92);
  text-align:center;
}

#uyari-inner{
  max-width:440px;
  padding:28px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  background:var(--skin-card);
  box-shadow:0 30px 80px rgba(0,0,0,.8);
}

#uyari-inner h2{
  margin-bottom:10px;
  color:var(--skin-accent);
  font-size:18px;
}

#uyari-mesaj{
  white-space:pre-line;
  color:rgba(255,255,255,.7);
  font-size:13px;
  line-height:1.6;
}

@media(max-width:480px){
  #player-loading-indicator{
    bottom:14px;
    min-width:148px;
    min-height:32px;
    padding:7px 12px;
    font-size:9px;
  }

  #unmute-overlay-btn{
    top:10px;
    padding:5px 11px;
    font-size:9.5px;
  }

  #settings-toggle-btn{
    top:calc(env(safe-area-inset-top,0px) + 8px);
    right:max(8px,env(safe-area-inset-right,0px));
    width:36px;
    height:36px;
    font-size:16px;
  }

  #control-drawer{
    top:calc(env(safe-area-inset-top,0px) + 48px);
    right:max(8px,env(safe-area-inset-right,0px));
    width:min(290px,calc(100vw - 16px));
    max-height:min(70dvh,420px);
    padding:10px;
    gap:10px;
    border-radius:14px;
  }

  .tab-btn{
    min-height:32px;
    padding:5px 2px;
    font-size:9.5px;
  }

  .preset-btn,
  .skin-btn,
  .quality-select{
    min-height:34px;
    padding:6px 7px;
    font-size:10.5px;
  }
}

@media(max-height:480px) and (orientation:landscape){
  #player-loading-indicator{
    bottom:10px;
  }

  #settings-toggle-btn{
    top:calc(env(safe-area-inset-top,0px) + 6px);

<script>
function hidePoster(){

    document.getElementById(
      'custom-poster-overlay'
    );

  if(
    poster &&
    !poster.classList.contains('hidden')
  ){
    poster.classList.add('hidden');
  }
}

function hideLoadingIndicator(){
  const loading=
    document.getElementById(
      'player-loading-indicator'
    );

  if(
    loading &&
    !loading.classList.contains('hide')
  ){
    loading.classList.add('hide');
  }
}

function showLoadingIndicator(){
  const loading=
    document.getElementById(
      'player-loading-indicator'
    );

  if(loading){
    loading.classList.remove('hide');
  }
}

(function initPlayerEngine(){

  const VALID_THEMES=
    new Set([
      'cyber',
      'netflix',
      'prime',
      'gold',
      'emerald',
      'amethyst'
    ]);

  const urlParams=
    new URLSearchParams(
      window.location.search
    );

  const themeParam=
    String(
      urlParams.get('theme') || ''
    ).toLowerCase();

  const savedTheme=
    String(
      localStorage.getItem(
        'player_skin_theme'
      ) || 'gold'
    ).toLowerCase();

  const activeTheme=
    VALID_THEMES.has(themeParam)
      ? themeParam
      : (
          VALID_THEMES.has(savedTheme)
            ? savedTheme
            : 'cyber'
        );

  document.documentElement.setAttribute(
    'data-theme',
    activeTheme
  );

  function updateThemeMeta(){

    const meta=
      document.querySelector(
        'meta[name="theme-color"]'
      );

    if(meta){

      meta.setAttribute(
        'content',
        getComputedStyle(
          document.documentElement
        )
        .getPropertyValue(
          '--skin-bg'
        )
        .trim() || '#000000'
      );

    }

  }

  document.addEventListener(
    'DOMContentLoaded',
    ()=>{

      showLoadingIndicator();
      updateThemeMeta();

      const toggleBtn=
        document.getElementById(
          'settings-toggle-btn'
        );

      const drawer=
        document.getElementById(
          'control-drawer'
        );

      const tabs=
        document.querySelectorAll(
          '.tab-btn'
        );

      const tabContents=
        document.querySelectorAll(
          '.tab-content'
        );

      const skinButtons=
        document.querySelectorAll(
          '.skin-btn'
        );

      const posterOverlay=
        document.getElementById(
          'custom-poster-overlay'
        );

      posterOverlay?.addEventListener(
        'click',
        ()=>{
          const video=
            document.querySelector(
              '#player-container video'
            );

          if(video){
            tryVideoPlay(video);
          }
        }
      );

      const closeDrawer=()=>{

        if(!drawer)return;

        drawer.classList.remove(
          'open'
        );

        toggleBtn?.setAttribute(
          'aria-expanded',
          'false'
        );

      };

      const openDrawer=()=>{

        if(!drawer)return;

        drawer.classList.add(
          'open'
        );

        toggleBtn?.setAttribute(
          'aria-expanded',
          'true'
        );

      };

      skinButtons.forEach(
        btn=>{

          const skin=
            btn.getAttribute(
              'data-skin'
            );

          if(skin===activeTheme){
            btn.classList.add(
              'active'
            );
          }

          btn.addEventListener(
            'click',
            ()=>{

              if(
                !VALID_THEMES.has(
                  skin
                )
              ){
                return;
              }

              document.documentElement.setAttribute(
                'data-theme',
                skin
              );

              localStorage.setItem(
                'player_skin_theme',
                skin
              );

              updateThemeMeta();

              skinButtons.forEach(
                b=>{
                  b.classList.toggle(
                    'active',
                    b===btn
                  );
                }
              );

            }
          );

        }
      );

      toggleBtn?.setAttribute(
        'aria-expanded',
        'false'
      );

      toggleBtn?.setAttribute(
        'aria-controls',
        'control-drawer'
      );

      toggleBtn?.addEventListener(
        'click',
        e=>{

          e.stopPropagation();

          drawer?.classList.contains(
            'open'
          )
            ? closeDrawer()
            : openDrawer();

        }
      );

      document.addEventListener(
        'pointerdown',
        e=>{

          if(
            !drawer?.classList.contains(
              'open'
            )
          ){
            return;
          }

          const target=e.target;

          if(
            target!==toggleBtn &&
            !drawer.contains(target)
          ){
            closeDrawer();
          }

        },
        {passive:true}
      );

      document.addEventListener(
        'keydown',
        e=>{

          if(e.key==='Escape'){
            closeDrawer();
          }

        }
      );

      tabs.forEach(
        tab=>{

          tab.addEventListener(
            'click',
            ()=>{

              const targetId=
                tab.getAttribute(
                  'data-tab'
                );

              tabs.forEach(
                t=>t.classList.remove(
                  'active'
                )
              );

              tabContents.forEach(
                c=>c.classList.remove(
                  'active'
                )
              );

              tab.classList.add(
                'active'
              );

              document
                .getElementById(
                  targetId
                )
                ?.classList.add(
                  'active'
                );

              drawer?.scrollTo({
                top:0,
                behavior:'smooth'
              });

            }
          );

        }
      );

      initAudioVideoFx();

    }
  );

})();

let videoSettings={
  brightness:Number(
    localStorage.getItem(
      'player_brightness'
    ) || 100
  ),
  contrast:Number(
    localStorage.getItem(
      'player_contrast'
    ) || 100
  ),
  saturate:Number(
    localStorage.getItem(
      'player_saturate'
    ) || 100
  )
};

let audioSettings={
  gain:Number(
    localStorage.getItem(
      'player_gain'
    ) || 100
  ),
  bass:
    localStorage.getItem(
      'player_bass'
    )==='1',
  vocal:
    localStorage.getItem(
      'player_vocal'
    )==='1'
};

let audioCtx=null;
let mediaSource=null;
let gainNode=null;
let bassFilter=null;
let vocalFilter=null;
let audioVideo=null;
let videoObserver=null;
let videoEventCleanup=null;
let boundVideo=null;
let audioUnlocked=false;
let autoplayTimers=[];

function clearAutoplayTimers(){

  autoplayTimers.forEach(
    timer=>{
      try{
        clearTimeout(timer);
      }catch(e){}
    }
  );

  autoplayTimers=[];

}

function scheduleAutoplay(delay){

  const timer=
    setTimeout(
      ()=>{
        forceAutoplay();
      },
      delay
    );

  autoplayTimers.push(
    timer
  );

}

function clampNumber(
  value,
  min,
  max,
  fallback
){

  const n=Number(value);

  return Number.isFinite(n)
    ? Math.min(
        max,
        Math.max(min,n)
      )
    : fallback;

}

videoSettings.brightness=
  clampNumber(
    videoSettings.brightness,
    60,
    180,
    100
  );

videoSettings.contrast=
  clampNumber(
    videoSettings.contrast,
    60,
    180,
    100
  );

videoSettings.saturate=
  clampNumber(
    videoSettings.saturate,
    0,
    220,
    100
  );

audioSettings.gain=
  clampNumber(
    audioSettings.gain,
    100,
    300,
    100
  );

function applyVideoFilters(){

  const video=
    document.querySelector(
      '#player-container video'
    );

  if(!video)return;

  const {
    brightness,
    contrast,
    saturate
  }=videoSettings;

  const filter=
    brightness===100 &&
    contrast===100 &&
    saturate===100
      ? 'none'
      : `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%)`;

  try{

    video.style.setProperty(
      'filter',
      filter,
      'important'
    );

  }catch(e){

    video.style.filter=
      filter;

  }

}

function updateVideoUI(){

  const ids=[
    [
      'slider-brightness',
      'val-brightness',
      videoSettings.brightness
    ],
    [
      'slider-contrast',
      'val-contrast',
      videoSettings.contrast
    ],
    [
      'slider-saturate',
      'val-saturate',
      videoSettings.saturate
    ]
  ];

  ids.forEach(
    ([inputId,labelId,value])=>{

      const input=
        document.getElementById(
          inputId
        );

      const label=
        document.getElementById(
          labelId
        );

      if(input){
        input.value=value;
      }

      if(label){
        label.textContent=
          value+'%';
      }

    }
  );

}

function updateAudioUI(){

  const gain=
    document.getElementById(
      'slider-gain'
    );

  const gainLabel=
    document.getElementById(
      'val-gain'
    );

  const bass=
    document.getElementById(
      'toggle-bass'
    );

  const vocal=
    document.getElementById(
      'toggle-vocal'
    );

  if(gain){
    gain.value=
      audioSettings.gain;
  }

  if(gainLabel){
    gainLabel.textContent=
      audioSettings.gain+
      '%';
  }

  if(bass){
    bass.checked=
      audioSettings.bass;
  }

  if(vocal){
    vocal.checked=
      audioSettings.vocal;
  }

}

function updateVideoParams(
  brightness,
  contrast,
  saturate
){

  videoSettings={
    brightness:
      clampNumber(
        brightness,
        60,
        180,
        100
      ),
    contrast:
      clampNumber(
        contrast,
        60,
        180,
        100
      ),
    saturate:
      clampNumber(
        saturate,
        0,
        220,
        100
      )
  };

  localStorage.setItem(
    'player_brightness',
    videoSettings.brightness
  );

  localStorage.setItem(
    'player_contrast',
    videoSettings.contrast
  );

  localStorage.setItem(
    'player_saturate',
    videoSettings.saturate
  );

  updateVideoUI();
  applyVideoFilters();

}

function applyAudioSettings(){

  if(
    !gainNode ||
    !bassFilter ||
    !vocalFilter
  ){
    return;
  }

  try{

    gainNode.gain.value=
      audioSettings.gain/100;

    bassFilter.gain.value=
      audioSettings.bass
        ? 10
        : 0;

    vocalFilter.gain.value=
      audioSettings.vocal
        ? 6
        : 0;

  }catch(e){}

}

async function resumeAudioContext(){

  if(!audioCtx){
    return;
  }

  try{

    if(audioCtx.state==='suspended'){
      await audioCtx.resume();
    }

  }catch(e){}

}

function disconnectAudioGraph(){

  try{
    mediaSource?.disconnect();
  }catch(e){}

  try{
    bassFilter?.disconnect();
  }catch(e){}

  try{
    vocalFilter?.disconnect();
  }catch(e){}

  try{
    gainNode?.disconnect();
  }catch(e){}

}

function setupAudioNodes(){

  const video=
    document.querySelector(
      '#player-container video'
    );

  if(!video){
    return false;
  }

  const needsEnhancer=
    audioSettings.gain!==100 ||
    audioSettings.bass ||
    audioSettings.vocal;

  if(!needsEnhancer){

    applyNativeAudioState(
      video
    );

    return true;

  }

  try{

    const AudioContextClass=
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){
      return false;
    }

    if(!audioCtx){
      audioCtx=
        new AudioContextClass();
    }

    if(
      audioVideo===video &&
      mediaSource
    ){

      applyAudioSettings();

      applyNativeAudioState(
        video
      );

      if(audioUnlocked){
        resumeAudioContext();
      }

      return true;
    }

    disconnectAudioGraph();

    mediaSource=null;
    gainNode=null;
    bassFilter=null;
    vocalFilter=null;
    audioVideo=null;

    const newSource=
      audioCtx.createMediaElementSource(
        video
      );

    const newGain=
      audioCtx.createGain();

    const newBass=
      audioCtx.createBiquadFilter();

    const newVocal=
      audioCtx.createBiquadFilter();

    newBass.type='lowshelf';
    newBass.frequency.value=150;

    );

    );

    );

    );

    mediaSource=newSource;

    audioVideo=video;

  }catch(error){

function applyNativeAudioState(video){

  if(!video){
    return;
  }

  try{

    if(!audioUnlocked){

      video.muted=true;
      video.defaultMuted=true;
      video.volume=0;

      video.setAttribute(
        'muted',
        ''
      );

    }else{

      video.muted=false;
      video.defaultMuted=false;
      video.volume=1;

      video.removeAttribute(
        'muted'
      );

    }

    video.autoplay=true;
    video.playsInline=true;

    video.setAttribute(
      'autoplay',
      ''
    );

    video.setAttribute(
      'playsinline',
      ''
    );

    video.setAttribute(
      'webkit-playsinline',
      ''
    );

    video.setAttribute(
      'x5-playsinline',
      'true'
    );

    video.setAttribute(
      'x5-video-player-type',
      'h5'
    );

    video.setAttribute(
      'x5-video-player-fullscreen',
      'false'
    );

  }catch(e){}

}

function prepareVideoForAutoplay(
  video
){

  if(!video)return;

  applyNativeAudioState(
    video
  );

}

function tryVideoPlay(video){

  if(!video){
    return Promise.resolve(false);
  }

  prepareVideoForAutoplay(
    video
  );

  try{

    const promise=
      video.play();

    if(
      promise &&
      typeof promise.then===
      'function'
    ){

      return promise.then(
        ()=>{
          hidePoster();
          hideLoadingIndicator();
          return true;
        }
      ).catch(
        ()=>{
          return false;
        }
      );

    }

    if(!video.paused){

      hidePoster();
      hideLoadingIndicator();

      return Promise.resolve(
        true
      );

    }

  }catch(e){}

  return Promise.resolve(false);

}

function unmuteEverything(){

  audioUnlocked=true;

  clearAutoplayTimers();

  const player=
    window.activeStreamPlayer?.player;

  const videos=
    document.querySelectorAll(
      '#player-container video'
    );

  try{

    if(player){

      player.unmute();
      player.setVolume(100);

    }

  }catch(e){}

  const tasks=[];

  videos.forEach(
    video=>{

      try{

        video.muted=false;
        video.defaultMuted=false;
        video.volume=1;

        video.removeAttribute(
          'muted'
        );

        video.autoplay=true;
        video.playsInline=true;

        video.setAttribute(
          'playsinline',
          ''
        );

        video.setAttribute(
          'webkit-playsinline',
          ''
        );

        if(
          audioSettings.gain!==100 ||
          audioSettings.bass ||
          audioSettings.vocal
        ){

          setupAudioNodes();

          if(audioCtx){
            tasks.push(
              resumeAudioContext()
            );
          }

        }

        const promise=
          video.play();

        if(
          promise &&
          typeof promise.then===
          'function'
        ){

          tasks.push(
            promise
          );

        }

      }catch(e){}

    }
  );

  try{

    if(player){
      player.play();
    }

  }catch(e){}

  Promise.allSettled(
    tasks
  ).finally(
    ()=>{

      hidePoster();

      const button=
        document.getElementById(
          'unmute-overlay-btn'
        );

      button?.classList.add(

function bindCurrentVideo(video){

  if(!video){
    return;
  }

  if(boundVideo===video){

    prepareVideoForAutoplay(
      video
    );

    applyVideoFilters();

    if(
      audioSettings.gain!==100 ||
      audioSettings.bass ||
      audioSettings.vocal
    ){

      setupAudioNodes();

    }

    return;
  }

  if(videoEventCleanup){
    videoEventCleanup();
  }

  boundVideo=video;

  prepareVideoForAutoplay(
    video
  );

  const reapply=()=>{

    prepareVideoForAutoplay(
      video
    );

    applyVideoFilters();

    if(
      audioSettings.gain!==100 ||
      audioSettings.bass ||
      audioSettings.vocal
    ){

      setupAudioNodes();

    }

  };

  const handlePlaying=()=>{

    hidePoster();
    hideLoadingIndicator();
    applyVideoFilters();

  };

  const handleCanPlay=()=>{

    reapply();

    tryVideoPlay(
      video
    );

  };

  video.addEventListener(
    'loadedmetadata',
    reapply,
    {passive:true}
  );

  video.addEventListener(
    'loadeddata',
    reapply,
    {passive:true}
  );

  video.addEventListener(
    'canplay',
    handleCanPlay,
    {passive:true}
  );

  video.addEventListener(
    'playing',
    handlePlaying,
    {passive:true}
  );

  video.addEventListener(
    'timeupdate',
    ()=>{
      if(
        video.currentTime>0 ||
        !video.paused
      ){

        hidePoster();
        hideLoadingIndicator();

      }
    },
    {passive:true}
  );

  videoEventCleanup=()=>{

    video.removeEventListener(
      'loadedmetadata',
      reapply
    );

    video.removeEventListener(
      'loadeddata',
      reapply
    );

    video.removeEventListener(
      'canplay',
      handleCanPlay
    );

    video.removeEventListener(
      'playing',
      handlePlaying
    );

  };

  reapply();

  tryVideoPlay(
    video
  );

}

function observePlayerVideo(){

  const container=
    document.getElementById(
      'player-container'
    );

  if(!container){
    return;
  }

  videoObserver?.disconnect();

  videoObserver=
    new MutationObserver(
      ()=>{
        const video=
          container.querySelector(
            'video'
          );

        if(
          video &&
          video!==boundVideo
        ){

          bindCurrentVideo(
            video
          );

          startAutoplayRetries();

        }else if(video){

          prepareVideoForAutoplay(
            video
          );

          applyVideoFilters();

        }
      }
    );

  videoObserver.observe(
    container,
    {
      childList:true,
      subtree:true
    }
  );

  const video=
    container.querySelector(
      'video'
    );

  if(video){

    bindCurrentVideo(
      video
    );

    startAutoplayRetries();

  }

}

function normalizeInputId(value){

  let v=
    String(
      value || ''
    ).trim();

  try{
    v=decodeURIComponent(v);
  }catch(e){}

  return v;

}

function extractIdFromUrl(value){

  const raw=
    normalizeInputId(
      value
    );

  if(!raw){
    return '';
  }

  try{

    const u=
      new URL(
        raw,
        window.location.href
      );

    const q=
      u.searchParams.get(
        'id'
      );

    if(q){

function loadFeedScript(){

        );

            );

function findFeedEvent(
  events,
  key
){

  const target=
    normalizeInputId(
      key
    );

  if(
    !target ||
    !Array.isArray(events)
  ){
    return null;
  }

  return events.find(
    event=>{

      const candidates=[
        event?.id,
        event?.channelId,
        event?.channel,
        event?.name,
        event?.title,
        event?.url,
        event?.streamUrl,
        event?.link
      ].map(
        x=>String(x || '')
      );

      return candidates.some(
        value=>{

          if(
            value===target
          ){
            return true;
          }

          try{

            const u=
              new URL(
                value,
                window.location.href
              );

            const q=
              u.searchParams.get(
                'id'
              );

            return q===target;

          }catch(e){

            return false;

          }

        }
      );

    }
  ) || null;

}

async function resolveFeedSource(
  value
){

  const key=
    extractIdFromUrl(
      value
    );

  if(!key){
    return null;
  }

  try{

    const events=
      await loadFeedScript();

    const event=
      findFeedEvent(
        events,
        key
      );

    if(!event){
      return null;
    }

    const candidates=[
      event.streamUrl,
      event.stream_url,
      event.url,
      event.link,
      event.source,
      event.src
    ]
    .map(
      x=>String(x || '').trim()
    )
    .filter(Boolean);

    const m3u=
      candidates.find(
        value=>
          /\.m3u8(?:$|[?#])/i.test(
            value
          )
      );

    if(m3u){
      return m3u;
    }

    const eventId=
      extractIdFromUrl(
        candidates.find(
          value=>/id=/i.test(
            value
          )
        ) ||
        event.id ||
        key
      );

    return eventId || key;

  }catch(e){

    console.warn(
      'Feed lookup failed:',
      e
    );

    return null;

  }

}

async function resolveCinemaSource(
  id
){

  if(
    !id ||
    typeof id!=='string'
  ){
    return null;
  }

  if(
    !id.startsWith(
      'androstreamlivech'
    )
  ){
    return null;
  }

  const videoId=
    id.replace(
      /^androstreamlivech(stream)?/,
      ''
    );

  if(!videoId){
    return null;
  }

  try{

    const response=
      await fetch(
        'https://streamsport365.com/cinema',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:JSON.stringify({
            AppId:'5000',
            AppVer:'1',
            VpcVer:'1.0.12',
            Language:'en',
            Token:'',
            VideoId:videoId
          })
        }
      );

    if(response.ok){

      const data=

      if(

      ){

          data.URL
        ).trim();

      }

    }

  }catch(e){

      'Cinema source request failed:',
      e
    );

  }

  return null;

}

class StreamPlayer{

  async init(){

      this;

    const hashParams=
      this.parseHashParams(
        window.location.hash
      );

    this.urlConfig={
      poster:
        this.safeDecode(
          hashParams.poster || ''
        ),
      watermark:
        this.safeDecode(
          hashParams.watermark || ''
        ),
      watermarkLink:
        this.safeDecode(
          hashParams.watermarkLink || ''
        ),
      watermarkPosition:
        this.safeDecode(
          hashParams.watermarkPosition ||
          'bottom-left'
        )
    };

    this.input=
      normalizeInputId(
        getInputValue()
      );

    this.directSource=
      /\.m3u8(?:$|[?#])/i.test(
        this.input
      )
      ? this.input
      : null;

    this.baseurls=[
      'https://andro.evrenesoglu121.click/checklist/',
      'https://andro.evrenesoglu115.click/checklist/',
      'https://andro.evrenesoglu111.click/checklist/',
      'https://andro.evrenesoglu113.click/checklist/'
    ];

    this.currentBaseIndex=0;
    this.switchingBase=false;
    this.feedSource=null;
    this.streamPath=null;

    if(this.directSource){

      this.source=
        this.directSource;

    }else{

      this.feedSource=
        await resolveFeedSource(
          this.input
        );

      if(
        this.feedSource &&
        /\.m3u8(?:$|[?#])/i.test(
          this.feedSource
        )
      ){

        this.source=
          this.feedSource;

        this.directSource=
          this.feedSource;

      }else{

        const id=
          extractIdFromUrl(
            this.feedSource ||
            this.input
          );

        const cinema=
          await resolveCinemaSource(
            id
          );

        if(cinema){

          this.source=
            cinema;

          this.directSource=
            cinema;

        }else{

          this.streamPath=
            this.getStreamPath(
              id
            );

          this.source=
            this.streamPath
              ? this.buildSource()
              : null;

        }

      }

    }

    if(!this.source){

      hideLoadingIndicator();

      const warning=
        document.getElementById(
          'uyarikutu'
        );

      const message=
        document.getElementById(
          'uyari-mesaj'
        );

      if(message){

        message.innerText=
          'Unable to fetch stream address.\nPlease check the channel ID or source link.';

      }

      if(warning){
        warning.style.display=
          'flex';
      }

      return;

    }

    const params=
      new URLSearchParams(
        window.location.search
      );

    const title=
      params.get(
        'title'
      );

    if(title){

      try{
        document.title=title;
      }catch(e){}

    }

    if(
      this.streamPath &&
      !this.directSource
    ){

      await this.resolveWorkingBase();

      this.source=
        this.buildSource();

    }

    this.initPlayer();

    const container=
      document.getElementById(
        'player-container'
      );

    if(!container){
      return;
    }

    this.player.attachTo(
      container
    );

    this.setupUnmuteOverlay();

    this.bindQualitySelectorUI();

    observePlayerVideo();

    startAutoplayRetries();

  }

  safeDecode(value){

    try{

      return decodeURIComponent(
        value
      );

    }catch(e){

      return String(
        value || ''
      );

    }

  }

  async resolveWorkingBase(){

    for(
      let i=0;
      i<this.baseurls.length;
      i++
    ){

      const ok=
        await this.checkBase(i);

      if(ok){

        this.currentBaseIndex=
          i;

        return true;

      }

    }

    this.currentBaseIndex=0;

    return false;

  }

  checkBase(index){

    const target=
      this.baseurls[index] +
      this.streamPath;

    const controller=
      typeof AbortController!=='undefined'
        ? new AbortController()
        : null;

    const timer=
      controller
        ? setTimeout(
            ()=>{
              try{
                controller.abort();
              }catch(e){}
            },
            5000
          )
        : null;

    const options={
      method:'GET',
      mode:'cors',
      cache:'no-store',
      credentials:'omit'
    };

    if(controller){
      options.signal=
        controller.signal;
    }

    return fetch(
      target,
      options
    )
    .then(
      response=>
        response.ok
    )
    .catch(
      ()=>{
        return false;
      }
    )
    .finally(
      ()=>{
        if(timer){
          clearTimeout(
            timer
          );
        }
      }
    );

  }

  initPlayer(){

    if(typeof Clappr==='undefined'){

      hideLoadingIndicator();

      const warning=
        document.getElementById(
          'uyarikutu'
        );

      const message=
        document.getElementById(
          'uyari-mesaj'
        );

      if(message){
        message.innerText=
          'Player library failed to load.\nPlease refresh the page.';
      }

      if(warning){
        warning.style.display=
          'flex';
      }

      return;

    }

    const plugins=[];

    if(window.LevelSelector){
      plugins.push(
        window.LevelSelector
      );
    }

    if(window.ClapprPip){

      if(
        window.ClapprPip.PipPlugin
      ){

        plugins.push(
          window.ClapprPip.PipPlugin
        );

      }

      if(
        window.ClapprPip.PipButton
      ){

        plugins.push(
          window.ClapprPip.PipButton
        );

      }

    }

    if(window.ClapprPIPPlugin){

      plugins.push(
        window.ClapprPIPPlugin
      );

    }

    this.player=
      new Clappr.Player({

        source:this.source,

        autoPlay:true,

        mute:true,

        disableVideoTagContextMenu:true,

        height:'100%',
        width:'100%',

        position:'bottom-left',

        chromeless:isIOS,

        watermark:
          this.urlConfig.watermark ||
          undefined,

        watermarkLink:
          this.urlConfig.watermarkLink ||
          undefined,

        levelSelectorConfig:{

          title:'QUALITY',

          labels:{
            '-1':'Auto'
          },

          labelCallback:
            function(
              playbackLevel,
              customLabel
            ){

              if(
                playbackLevel &&
                playbackLevel.level &&
                playbackLevel.level.height
              ){

                return(
                  playbackLevel.level.height+
                  'p'
                );

              }

              if(customLabel){
                return customLabel;
              }

              if(
                playbackLevel &&
                playbackLevel.level &&
                playbackLevel.level.bitrate
              ){

                return(
                  Math.round(
                    playbackLevel.level.bitrate/
                    1000
                  )+
                  ' kbps'
                );

              }

              return 'Auto';

            }

        },

        hlsjsConfig:{

          liveSyncDurationCount:4,
          maxMaxBufferLength:30,
          levelLoadingMaxRetry:5,
          fragLoadingMaxRetry:6,
          liveMaxLatencyDurationCount:6,
          liveDurationInfinity:true

        },

        playback:{

          playInline:true,

          controls:isIOS,

          crossOrigin:'anonymous',

          hlsjsConfig:{

            xhrSetup:
              (xhr,requestUrl)=>{

                try{
                  xhr.withCredentials=
                    false;
                }catch(e){}

                xhr.addEventListener(
                  'loadend',
                  ()=>{

                    if(
                      this.streamPath &&
                      xhr.status===403
                    ){

                      this.switchToNextBase(
                        '403'
                      );

                    }

                  }
                );

              }

          }

        },

        disableErrorScreen:true,

        plugins,

        language:'en',

        strings:{
          en:{
            live:'LIVE',
            default_error_message:
              'A playback error occurred.',
            default_error_title:
              'Notice'
          }
        }

      });

    this.setupPlayerEvents();

  }

  setupUnmuteOverlay(){

    const button=
      document.getElementById(
        'unmute-overlay-btn'
      );

    if(!button){
      return;
    }

    button.addEventListener(
      'click',
      e=>{

        e.preventDefault();
        e.stopPropagation();

        unmuteEverything();

      }
    );

    if(this.player){

      this.player.on(
        Clappr.Events.PLAYER_VOLUMEUPDATE,
        volume=>{

          if(
            audioUnlocked &&
            Number(volume)>0
          ){

            button.classList.add(
              'hidden'
            );

          }

        }
      );

    }

  }

  bindQualitySelectorUI(){

    const dropdown=
      document.getElementById(
        'drawer-quality-selector'
      );

    if(
      !dropdown ||
      !this.player
    ){
      return;
    }

    const populateLevels=
      (attempt=0)=>{

        const levelPlugin=
          this.player.getPlugin(
            'level_selector'
          );

        const levels=
          Array.isArray(
            levelPlugin?.levels
          )
            ? levelPlugin.levels
            : [];

        if(levels.length){

          const current=
            dropdown.value;

          dropdown.innerHTML=
            '<option value="-1">Auto</option>';

          levels.forEach(
            (level,index)=>{

              const height=
                Number(
                  level?.height ||
                  0
                );

              const bitrate=
                Number(
                  level?.bitrate ||
                  0
                );

              const label=
                height
                  ? `${height}p`
                  : (
                      bitrate
                        ? `${Math.round(
                            bitrate/
                            1000
                          )} kbps`
                        : `Level ${index+1}`
                    );

              const option=
                document.createElement(
                  'option'
                );

              option.value=
                String(index);

              option.textContent=
                label;

              dropdown.appendChild(
                option
              );

            }
          );

          if(
            [...dropdown.options]
              .some(
                option=>
                  option.value===
                  current
              )
          ){

            dropdown.value=
              current;

          }

          return;

        }

        if(attempt<24){

          setTimeout(
            ()=>{
              populateLevels(
                attempt+1
              );
            },
            500
          );

        }

      };

    this.player.on(
      Clappr.Events.PLAYER_READY,
      ()=>{

        hideLoadingIndicator();

        setTimeout(
          ()=>{
            populateLevels();
            applyVideoFilters();
            observePlayerVideo();
            startAutoplayRetries();
          },
          100
        );

      }
    );

    dropdown.addEventListener(
      'change',
      e=>{

        const val=
          Number(
            e.target.value
          );

        const levelPlugin=
          this.player.getPlugin(
            'level_selector'
          );

        if(
          levelPlugin &&
          typeof levelPlugin.changeLevel===
          'function'
        ){

          levelPlugin.changeLevel(
            Number.isFinite(val)
              ? val
              : -1
          );

        }

      }
    );

  }

  parseHashParams(hash){

    if(
      !hash ||
      hash==='#'
    ){
      return {};
    }

    const params={};

    hash
      .substring(1)
      .split('&')
      .forEach(
        item=>{

          const index=
            item.indexOf('=');

          if(index===-1){
            return;
          }

          const key=
            item.substring(
              0,
              index
            );

          const value=
            item.substring(
              index+1
            );

          if(key && value){
            params[key]=value;
          }

        }
      );

    return params;

  }

  buildSource(){

    if(!this.streamPath){
      return null;
    }

    return(
      this.baseurls[
        this.currentBaseIndex
      ]+
      this.streamPath
    );

  }

  getStreamPath(id){

    const value=
      String(
        id || ''
      );

    const useRealStream=
      pageURL.searchParams.get(
        'real'
      )==='1';

    if(!value){
      return null;
    }

    if(
      (
        value===
          'androstreamlivebs1' ||
        value===
          'facebooklivebs1'
      ) &&
      !useRealStream
    ){

      return 'batutest.m3u8';

    }

    if(
      value.startsWith(
        'facebooklive'
      )
    ){

      return(
        value+
        '.m3u8'
      );

    }

    if(
      value.startsWith(
        'androstreamlive'
      )
    ){

      if(isIOS){

        const suffix=
          value.substring(
            'androstreamlive'.length
          );

        return(
          'facebooklive'+
          suffix+
          '.m3u8'
        );

      }

      return(
        value+
        '.m3u8'
      );

    }

    return null;

  }

  setupPlayerEvents(){

    if(!this.player){
      return;
    }

    this.player.on(
      Clappr.Events.PLAYER_READY,
      ()=>{

        hideLoadingIndicator();

        try{

          $('.clappr-watermark a')
            .removeAttr('target')
            .removeAttr('href')
            .css(
              'cursor',
              'initial'
            );

        }catch(e){}

        setTimeout(
          ()=>{
            observePlayerVideo();
            applyVideoFilters();
            startAutoplayRetries();

            if(
              audioSettings.gain!==100 ||
              audioSettings.bass ||
              audioSettings.vocal
            ){

              setupAudioNodes();

            }

          },
          100
        );

      }
    );

    this.player.on(
      Clappr.Events.PLAYER_PLAY,
      ()=>{

        hideLoadingIndicator();
        applyVideoFilters();

      }
    );

    this.player.on(
      Clappr.Events.PLAYER_PLAYING,
      ()=>{

        hidePoster();
        hideLoadingIndicator();

      }
    );

    if(
      this.player.core &&
      Clappr.Events.CORE_ACTIVE_CONTAINER_CHANGED
    ){

      this.player.core.on(
        Clappr.Events.CORE_ACTIVE_CONTAINER_CHANGED,
        container=>{

          if(
            container &&
            Clappr.Events.CONTAINER_ERROR
          ){

            container.on(
              Clappr.Events.CONTAINER_ERROR,
              ()=>{
                this.handlePlaybackError();
              }
            );

          }

          if(
            container &&
            Clappr.Events.CONTAINER_TIMEUPDATE
          ){

            container.on(
              Clappr.Events.CONTAINER_TIMEUPDATE,
              ()=>{
                hidePoster();
                hideLoadingIndicator();
              }
            );

          }

        }
      );

    }

    this.player.on(
      Clappr.Events.PLAYER_ERROR,
      ()=>{

        this.handlePlaybackError();

      }
    );

  }

  handlePlaybackError(){

    this.switchToNextBase(
      'playback error'
    );

  }

  switchToNextBase(reason){

    if(
      !this.streamPath ||
      this.switchingBase
    ){

      return false;

    }

    if(
      this.currentBaseIndex >=
      this.baseurls.length-1
    ){

      return false;

    }

    this.switchingBase=true;

    this.currentBaseIndex++;

    const newSource=
      this.buildSource();

    this.source=
      newSource;

    clearAutoplayTimers();

    showLoadingIndicator();

    try{

      this.player.load(
        newSource
      );

      this.player.play();

    }catch(e){

      try{

        this.player.configure({
          source:newSource
        });

      }catch(error){}

    }

    setTimeout(
      ()=>{
        observePlayerVideo();
        applyVideoFilters();
        forceAutoplay();
      },
      250
    );

    setTimeout(
      ()=>{
        this.switchingBase=false;
      },
      2000
    );

    return true;

  }

}

if(
  window.ClapprPIPPlugin &&
  !window.ClapprPip
){

  window.ClapprPip={
    PipPlugin:
      window.ClapprPIPPlugin
  };

}

try{

  new StreamPlayer();

}catch(error){

  console.error(
    'Player startup error:',
    error
  );

  hideLoadingIndicator();

  const warning=
    document.getElementById(
      'uyarikutu'
    );

  const message=
    document.getElementById(
      'uyari-mesaj'
    );

  if(message){

    message.innerText=
      'Player startup failed.\nPlease refresh the page.';

  }

  if(warning){
    warning.style.display=
      'flex';
  }

}
</script>
