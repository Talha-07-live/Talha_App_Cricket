<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Talha's Ultra Player 🔒 v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
.player{position:relative;width:100vw;height:100dvh;background:#000;overflow:hidden}

.frame-wrap{position:absolute;inset:0;background:#000}
.frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#000}

/* ================= 🛡 TOP BAR — site er X/Telegram/ad button PURA DHAKE ================= */
/* height = clamp: choto screen e choto, boro screen e boro — always perfectly fit */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;
  height:clamp(52px,9vh,84px);
  display:flex;align-items:center;gap:clamp(6px,1.2vw,12px);
  padding:clamp(6px,1.5vh,12px) max(clamp(10px,2vw,16px),env(safe-area-inset-left)) 0;
  background:linear-gradient(to bottom,#05050c 0%,#0a0a16 70%,rgba(10,10,22,.85) 100%);
  box-shadow:0 4px 18px rgba(0,0,0,.7)}
.topbar .brand{display:flex;align-items:center;gap:6px;
  padding:clamp(5px,1vh,8px) clamp(8px,1.5vw,14px);border-radius:10px;
  background:rgba(122,60,255,.16);border:1px solid rgba(122,60,255,.45);
  color:#fff;font-size:clamp(9px,1.6vw,12px);font-weight:900;letter-spacing:.6px;white-space:nowrap}
.brand .dot{width:clamp(6px,1vw,8px);height:clamp(6px,1vw,8px);border-radius:50%;
  background:#00e676;box-shadow:0 0 8px #00e676;animation:pulse 1.4s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.35}}

.topbar .spacer{flex:1}

/* top bar er button gula — auto-fit */
.tbtn{height:clamp(32px,5.5vh,44px);min-width:clamp(32px,5.5vh,44px);padding:0 clamp(8px,1.5vw,14px);
  border:1px solid rgba(255,255,255,.2);border-radius:clamp(9px,1.4vw,13px);
  background:rgba(12,12,24,.85);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;backdrop-filter:blur(10px);transition:transform .12s;flex-shrink:0}
.tbtn:active{transform:scale(.9)}
.tbtn svg{width:clamp(15px,2.4vw,20px);height:clamp(15px,2.4vw,20px);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn .txt{font-size:clamp(9px,1.6vw,12px);font-weight:800;white-space:nowrap}
.tbtn.live{border-color:#ff174f;color:#ff5c7a}
.tbtn.live .txt{color:#ff5c7a}

/* ================= side guards (ad zone block) ================= */
.guard{position:absolute;top:clamp(52px,9vh,84px);bottom:26%;width:12%;z-index:6;pointer-events:auto}
.guard.left{left:0}.guard.right{right:0}

.overlay{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at center,rgba(65,30,125,.05),transparent 60%)}

.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(88vw,380px);
  padding:26px 20px;border-radius:20px;background:rgba(10,10,22,.92);
  border:1px solid rgba(122,60,255,.45);color:#fff;text-align:center;
  box-shadow:0 18px 60px rgba(0,0,0,.7);backdrop-filter:blur(18px);display:none;pointer-events:auto;z-index:40}
.status.show{display:block;animation:pop .3s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.9);opacity:0}}
.status h2{font-size:17px;margin-bottom:8px}
.status p{font-size:12px;line-height:1.6;color:rgba(255,255,255,.6);margin-bottom:16px}
.btn{border:0;border-radius:10px;padding:11px 18px;background:linear-gradient(110deg,#7a3cff,#00cfea);
  color:#fff;font-size:12px;font-weight:850;cursor:pointer;margin:0 5px}

/* ================= BOTTOM CONTROL PANEL ================= */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:20;
  padding:0 max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:linear-gradient(to top,rgba(0,0,0,.94) 60%,transparent);
  transition:opacity .35s,transform .35s}
.panel.hidden{opacity:0;transform:translateY(16px);pointer-events:none}

.seekrow{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
.time{color:#fff;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.track{position:relative;flex:1;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track .bg{position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.track .fill{position:absolute;left:0;height:4px;border-radius:4px;width:0%;
  background:linear-gradient(90deg,#7a3cff,#00cfea);box-shadow:0 0 10px rgba(0,207,234,.6)}
.track .knob{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px rgba(0,207,234,.9);left:0;transform:translateX(-50%);transition:width .1s,height .1s}
.track:active .knob{width:18px;height:18px}
.track.live .fill{background:#ff174f;box-shadow:0 0 10px rgba(255,23,79,.7)}

.row{display:flex;align-items:center;justify-content:center;gap:14px}
.cbtn{width:48px;height:48px;border:1px solid rgba(255,255,255,.18);border-radius:15px;
  background:rgba(8,8,16,.8);color:#fff;display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(10px);transition:transform .12s;touch-action:manipulation}
.cbtn:active{transform:scale(.85);background:rgba(122,60,255,.45)}
.cbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn svg .solid{fill:currentColor;stroke:none}
.cbtn.big{width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,#7a3cff,#00cfea);
  border:0;box-shadow:0 6px 22px rgba(122,60,255,.45)}
.cbtn.big svg{width:28px;height:28px}

.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%) translateY(10px);
  padding:9px 16px;border-radius:12px;font-size:12px;font-weight:700;color:#fff;
  background:rgba(10,10,22,.92);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:.3s;z-index:25;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.ripple{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(0,207,234,.35);
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900;
  animation:rip .6s ease forwards;pointer-events:none;z-index:15}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(2.2);opacity:0}}

.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.14);border-top-color:#00d8ff;border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* landscape compact */
@media(max-height:430px) and (orientation:landscape){
  .topbar{height:clamp(44px,10vh,60px)}
  .guard{top:clamp(44px,10vh,60px);bottom:30%}
  .cbtn{width:40px;height:40px}.cbtn.big{width:52px;height:52px}
  .toast{bottom:100px}
}
/* very small screens */
@media(max-width:360px){
  .tbtn .txt{display:none} /* khub choto screen e sudhu icon */
  .brand{letter-spacing:0}
}
</style>
</head>
<body>
<div class="player" id="player">

  <div class="frame-wrap" id="frameWrap"></div>

  <div class="guard left" id="guardL"></div>
  <div class="guard right" id="guardR"></div>

  <div class="overlay"></div>

  <!-- 🛡 TOP BAR: site er X/Telegram/ad button puro dhake + amar button -->
  <div class="topbar" id="topbar">
    <div class="brand"><span class="dot"></span>TALHA'S ULTRA PLAYER</div>
    <div class="spacer"></div>
    <button class="tbtn live" id="liveBtn"><span class="txt">● LIVE</span></button>
    <button class="tbtn" id="topReload" aria-label="Reload">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
    </button>
    <button class="tbtn" id="topFs" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
  </div>

  <!-- ============ BOTTOM PANEL (Volume & Forward REMOVED ✅) ============ -->
  <div class="panel" id="panel">
    <div class="seekrow">
      <div class="time" id="curTime">0:00</div>
      <div class="track" id="track">
        <div class="bg"></div>
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="time" id="durTime">LIVE</div>
    </div>
    <div class="row">
      <button class="cbtn" id="reloadBtn" aria-label="Reload">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
      </button>
      <button class="cbtn" id="rewBtn" aria-label="Rewind 10s">
        <svg viewBox="0 0 24 24"><path class="solid" d="M11 8L5 12l6 4v-3.3c4 0 6.5 1.2 8 3.3-.5-4-3.5-7-8-7V8z"/></svg>
      </button>
      <button class="cbtn big" id="playBtn" aria-label="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path class="solid" d="M8 5l11 7-11 7z"/></svg>
      </button>
      <button class="cbtn" id="fsBtn" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="status show" id="statusCard">
    <div class="spinner" id="spinner"></div>
    <h2 id="statusTitle">Checking stream…</h2>
    <p id="statusText">Validating the event ID before loading the player.</p>
    <button class="btn" id="retryBtn" style="display:none">Retry</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const playerEl = $('player'), frameWrap = $('frameWrap'), statusCard = $('statusCard'),
        statusTitle = $('statusTitle'), statusText = $('statusText'), spinner = $('spinner'),
        retryBtn = $('retryBtn'), panel = $('panel'), toast = $('toast'),
        fill = $('fill'), knob = $('knob'), track = $('track'),
        curTime = $('curTime'), durTime = $('durTime');

  let wrapperIframe = null, video = null, isLive = true, dragging = false;
  let lastTap = 0, lastTapX = 0;

  function showStatus(title, text, canRetry=false){
    statusCard.classList.add('show');
    statusTitle.textContent = title;
    statusText.textContent = text;
    spinner.style.display = canRetry ? 'none' : 'block';
    retryBtn.style.display = canRetry ? 'inline-block' : 'none';
  }
  const hideStatus = () => statusCard.classList.remove('show');

  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  function ripple(x, y, text){
    const r = document.createElement('div');
    r.className = 'ripple';
    r.textContent = text;
    r.style.left = (x-32)+'px'; r.style.top = (y-32)+'px';
    playerEl.appendChild(r);
    setTimeout(()=>r.remove(), 650);
  }

  function getChannelId(){
    const p = new URLSearchParams(location.search);
    return (p.get('Talha')||p.get('channelId')||p.get('id')||p.get('channel')||'').trim();
  }
  const isValidChannelId = id => /^[A-Za-z0-9_-]*\d+$/.test(id);

  /* ============================================================
     🔒 LOCK SNIPPET — X/Telegram button REMOVE + ads kill
  ============================================================ */
  const LOCK_SNIPPET = `
  <style id="talha-lock">
    /* ❌ X / Twitter / Telegram / share button remove */
    a[href*="twitter.com"], a[href*="x.com"], a[href*="t.me"],
    a[href*="telegram"], a[aria-label*="Telegram"], a[aria-label*="Twitter"],
    a[aria-label*="X"], [class*="twitter"], [class*="telegram"],
    [class*="social"], [class*="share"], [class*="Social"],
    svg[class*="twitter"], svg[class*="telegram"]{display:none!important}
    /* ❌ ads + popup */
    iframe[src*="doubleclick"],iframe[src*="googlesyndication"],iframe[src*="ads."],
    ins.adsbygoogle,[class*="banner-ad"],[id*="popup"],[class*="popup"],
    [class*="interstitial"],[class*="overlay-ad"]{display:none!important}
    /* ❌ image click block */
    img,picture,source{pointer-events:none!important;-webkit-user-drag:none!important}
    a,[onclick]{pointer-events:none!important}
    *{-webkit-touch-callout:none!important;user-select:none!important}
    html,body{overflow:hidden!important;background:#000!important}
    /* top zone khalikoro — amra nijerai dhakbo */
  </style>
  <script>
    (function nuke(){
      // X / Telegram / social button DOM theke puro remove
      document.querySelectorAll('a[href*="twitter.com"],a[href*="x.com"],a[href*="t.me"],a[href*="telegram"],[class*="social"],[class*="share"]').forEach(e=>e.remove());
      document.querySelectorAll('ins.adsbygoogle,[id*="popup"],[class*="popup"],[class*="interstitial"]').forEach(e=>e.remove());
      setTimeout(nuke,800);
    })();
    (function closer(){
      document.querySelectorAll('[class*="close"],[class*="skip"],[aria-label*="Close"]').forEach(b=>{try{b.click()}catch(e){}});
      setTimeout(closer,1500);
    })();
    document.addEventListener('contextmenu',e=>e.preventDefault(),true);
    document.addEventListener('dragstart',e=>e.preventDefault(),true);
  <\/script>`;

  function buildLockedPlayer(channelId){
    frameWrap.innerHTML = '';
    const eventUrl = 'https://mahsunsports.xyz/event.html?id=' + encodeURIComponent(channelId);

    const innerDoc = `<!DOCTYPE html><html><head>
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
      #ev{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
      </head><body>
      <iframe id="ev" src="${eventUrl}" allow="autoplay; fullscreen; encrypted-media"
        allowfullscreen webkitallowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
      ${LOCK_SNIPPET}
      </body></html>`;

    wrapperIframe = document.createElement('iframe');
    wrapperIframe.title = 'Talha Locked Player';
    wrapperIframe.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-presentation');
    wrapperIframe.allow = 'autoplay; fullscreen; encrypted-media';
    wrapperIframe.setAttribute('allowfullscreen','true');
    wrapperIframe.srcdoc = innerDoc;

    wrapperIframe.addEventListener('load', () => {
      hideStatus();
      showToast('🛡 Site buttons covered · 🔒 Lock ON');
      setTimeout(findVideo, 1500);
      setTimeout(findVideo, 4500);
    }, {once:true});
    frameWrap.appendChild(wrapperIframe);
  }

  /* ---------------- video detect + control ---------------- */
  function findVideo(){
    video = null;
    try{
      const wdoc = wrapperIframe && wrapperIframe.contentDocument;
      if(wdoc){
        video = wdoc.querySelector('video');
        if(!video){
          const inner = wdoc.querySelector('iframe');
          try{ if(inner && inner.contentDocument) video = inner.contentDocument.querySelector('video'); }catch(e){}
        }
      }
      if(!video) video = document.querySelector('video');
    }catch(e){}
    if(video){
      video.addEventListener('timeupdate', updateSeek);
      video.addEventListener('play', ()=>setPlayIcon(false));
      video.addEventListener('pause', ()=>setPlayIcon(true));
      updateSeek();
    }
  }

  function fmt(s){
    s = Math.max(0, Math.floor(s||0));
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }

  function updateSeek(){
    if(!video || dragging) return;
    const d = video.duration;
    if(!d || !isFinite(d) || d === Infinity){
      isLive = true;
      track.classList.add('live');
      fill.style.width = '100%'; knob.style.left = '100%';
      curTime.textContent = 'LIVE'; durTime.textContent = '●';
      return;
    }
    isLive = false;
    track.classList.remove('live');
    durTime.textContent = fmt(d);
    curTime.textContent = fmt(video.currentTime);
    const pct = (video.currentTime / d) * 100;
    fill.style.width = pct + '%'; knob.style.left = pct + '%';
  }

  function setPlayIcon(paused){
    $('playIcon').innerHTML = paused
      ? '<path class="solid" d="M8 5l11 7-11 7z"/>'
      : '<path class="solid" d="M8 5h3v14H8zM13 5h3v14h-3z"/>';
  }

  function cmd(action, val){
    if(!video) return false;
    try{
      if(action==='toggle'){ video.paused ? video.play() : video.pause(); return true; }
      if(action==='skip'){ video.currentTime = Math.max(0, video.currentTime + val); return true; }
      if(action==='seek'){ video.currentTime = val * (video.duration||0); return true; }
    }catch(e){}
    return false;
  }

  /* ---------------- double-tap gesture ---------------- */
  playerEl.addEventListener('pointerup', e => {
    if(panel.contains(e.target) || $('topbar').contains(e.target)) return;
    if(e.target.closest('.guard,.toast,.status')) return;
    const now = Date.now();
    if(now - lastTap < 320 && Math.abs(e.clientX - lastTapX) < 60){
      const goFwd = e.clientX > innerWidth/2;
      if(cmd('skip', goFwd ? 10 : -10)){
        ripple(e.clientX, e.clientY, goFwd ? '⏩ +10s' : '⏪ -10s');
      }else{
        showToast('⚠️ Video not reachable — native tap use koro');
      }
      lastTap = 0;
    }else{ lastTap = now; lastTapX = e.clientX; }
  });

  /* ---------------- seek bar ---------------- */
  function pctFrom(e){
    const r = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.min(1, Math.max(0, x / r.width));
  }
  track.addEventListener('pointerdown', e => {
    if(isLive){ showToast('⏱ Live stream — seek off'); return; }
    if(!video){ showToast('⚠️ Seek needs direct video access'); return; }
    dragging = true; moveDrag(e);
  });
  window.addEventListener('pointermove', e => {
    if(!dragging) return;
    const p = pctFrom(e);
    fill.style.width = (p*100)+'%'; knob.style.left = (p*100)+'%';
    curTime.textContent = fmt(p * (video.duration||0));
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  window.addEventListener('pointerup', e => {
    if(!dragging) return;
    dragging = false;
    try{ video.currentTime = pctFrom(e) * (video.duration||0); }catch(err){}
    updateSeek(); pokePanel();
  });

  /* ---------------- buttons ---------------- */
  function doPlay(){
    pokePanel();
    if(cmd('toggle')){
      setPlayIcon(video ? video.paused : false);
      showToast(video && video.paused ? '▶ Playing' : '⏸ Paused');
    }else{
      showToast('👆 Tap video center to play/pause');
    }
  }
  function doRew(){
    pokePanel();
    cmd('skip',-10) ? showToast('⏪ -10 sec') : showToast('⚠️ Double-tap left side of video');
  }
  function doReload(){
    showToast('Reloading…');
    loadPlayer();
  }
  async function doFs(){
    pokePanel();
    try{
      if(document.fullscreenElement){ await document.exitFullscreen(); return; }
      if(playerEl.requestFullscreen) await playerEl.requestFullscreen({navigationUI:'hide'});
      else if(playerEl.webkitRequestFullscreen) playerEl.webkitRequestFullscreen();
      else showToast('Fullscreen unavailable');
    }catch(_){ showToast('Fullscreen blocked'); }
  }

  $('playBtn').onclick = doPlay;
  $('rewBtn').onclick = doRew;
  $('reloadBtn').onclick = doReload;
  $('fsBtn').onclick = doFs;
  $('topReload').onclick = doReload;
  $('topFs').onclick = doFs;
  $('liveBtn').onclick = () => showToast('📡 Live stream cholche');
  retryBtn.onclick = loadPlayer;

  /* ---------------- auto-hide panel ---------------- */
  let hideTimer;
  function pokePanel(){
    panel.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>panel.classList.add('hidden'), 4000);
  }
  ['pointerdown','pointermove','touchstart'].forEach(ev=>
    playerEl.addEventListener(ev, pokePanel, {passive:true}));

  /* ---------------- load ---------------- */
  function loadPlayer(){
    const channelId = getChannelId();
    if(!channelId){
      showStatus('No event ID found','Use a URL such as ?Talha=androstreamlivech20389023.', true);
      return;
    }
    if(!isValidChannelId(channelId)){
      showStatus('Invalid event ID','Channel ID must end with a numeric value.', true);
      return;
    }
    video = null; isLive = true;
    setPlayIcon(true);
    showStatus('Loading event…','Connecting to the locked event player.');
    buildLockedPlayer(channelId);
    pokePanel();
  }

  loadPlayer();
})();
</script>
</body>
</html>
